<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040d">
<meta name="color-scheme" content="dark">
<title>Moonlit</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02040d;overscroll-behavior:none}canvas{display:block;width:100%;height:100%;height:100dvh;touch-action:manipulation}body{position:fixed;inset:0} 
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="A quiet moonlit mountain lake beneath a starry midnight sky"></canvas>
<script>
(()=>{
const c=document.getElementById('scene'),g=c.getContext('2d'),bg=document.createElement('canvas'),fg=document.createElement('canvas');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let w,h,d,moon,lake,stars,ripples,frame=0,start=0;
function rand(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const mix=(a,b,t)=>a+(b-a)*t;
function fill(ctx,pts,col){ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=col;ctx.fill();}
function glow(ctx,x,y,r,stops){const gr=ctx.createRadialGradient(x,y,0,x,y,r);stops.forEach(([a,b])=>gr.addColorStop(a,b));ctx.fillStyle=gr;ctx.fillRect(x-r,y-r,r*2,r*2);}
function mountain(ctx,pts,col){const p=pts.map(([x,y])=>[x*w,y*h]);p.push([w,lake+5],[0,lake+5]);fill(ctx,p,col);}
function pine(ctx,x,y,s,shade,seed){const r=rand(seed);ctx.fillStyle=shade;ctx.fillRect(x-s*.025,y-s*.78,s*.05,s*.8);let p=[[x,y-s]];for(let i=0;i<9;i++){let t=i/9,yy=y-s*(.92-t*.79),b=s*(.035+t*.24);p.push([x-b*(.75+r()*.45),yy+s*.13],[x-b*.34,yy+s*.11]);}p.push([x,y-s*.045]);for(let i=8;i>=0;i--){let t=i/9,yy=y-s*(.92-t*.79),b=s*(.035+t*.24);p.push([x+b*.35,yy+s*.11],[x+b*(.75+r()*.45),yy+s*.13]);}fill(ctx,p,shade);}
function setup(){
 w=c.clientWidth;h=c.clientHeight;d=Math.min(devicePixelRatio||1,2);if(!w||!h)return;
 for(let s of [c,bg,fg]){s.width=Math.round(w*d);s.height=Math.round(h*d);s.getContext('2d').setTransform(d,0,0,d,0,0);}
 let b=bg.getContext('2d'),f=fg.getContext('2d'),r=rand(4237);lake=h*.635;moon={x:w*(w/h<.8?.55:.58),y:h*.235,r:Math.min(w*.125,h*.115,106)};
 let sky=b.createLinearGradient(0,0,0,h*.76);for(let [a,v] of [[0,'#010209'],[.36,'#050b1a'],[.72,'#0b192e'],[1,'#12223a']])sky.addColorStop(a,v);b.fillStyle=sky;b.fillRect(0,0,w,h);
 glow(b,moon.x,moon.y,moon.r*5,[[0,'rgba(88,112,171,.14)'],[.4,'rgba(40,63,111,.085)'],[1,'rgba(20,31,65,0)']]);
 glow(b,w*.5,lake,w*.73,[[0,'rgba(47,69,105,.17)'],[1,'rgba(26,42,75,0)']]);
 const ridges=[[[0,.52],[.1,.49],[.17,.51],[.23,.47],[.29,.495],[.36,.46],[.42,.51],[.49,.53],[.57,.48],[.65,.43],[.72,.49],[.78,.465],[.86,.51],[.93,.47],[1,.49]],[[0,.435],[.06,.47],[.11,.48],[.19,.53],[.24,.54],[.31,.59],[.40,.605],[.5,.628],[.59,.59],[.67,.59],[.75,.55],[.81,.51],[.87,.49],[.93,.42],[1,.46]],[[0,.51],[.07,.475],[.12,.505],[.18,.535],[.24,.515],[.30,.56],[.36,.545],[.42,.58],[.50,.552],[.57,.57],[.65,.53],[.71,.55],[.78,.49],[.84,.53],[.9,.46],[1,.52]]];
 function skyline(x){return Math.min(...ridges.map(pts=>{let i=pts.findIndex(p=>p[0]>=x);if(i<=0)return pts[0][1];let [a,b]=[pts[i-1],pts[i]];return mix(a[1],b[1],(x-a[0])/(b[0]-a[0]));}));}
 stars=[];const n=Math.floor(Math.min(280,Math.max(110,w*h/2900)));
 for(let i=0;i<n;i++){let x=r()*w,y=r()*lake*.96;if(y>h*skyline(x/w)-2||Math.hypot(x-moon.x,y-moon.y)<moon.r*1.09)continue;let a=.13+r()*.58,s=.3+Math.pow(r(),4)*1.2;stars.push({x,y,a,s,p:r()*6.28,v:.15+r()*.35,c:r()>.86?'#b2c8fa':'#e3e9ff'});}
 // Distant, barely visible ribbons of starlight.
 for(let i=0;i<45;i++){let x=w*(.07+r()*.86),y=h*(.11+.28*(x/w)+r()*.085),rr=8+r()*22;glow(b,x,y,rr,[[0,'rgba(92,112,154,.010)'],[1,'rgba(92,112,154,0)']]);}
 // A softly luminous, textured full moon.
 let {x,y,r:mr}=moon;
 glow(b,x,y,mr*2.9,[[0,'rgba(218,230,255,.17)'],[.35,'rgba(178,202,255,.10)'],[.58,'rgba(108,141,212,.044)'],[1,'rgba(86,117,190,0)']]);
 b.save();b.beginPath();b.arc(x,y,mr,0,Math.PI*2);b.clip();let mg=b.createRadialGradient(x-mr*.24,y-mr*.27,mr*.03,x,y,mr*1.12);mg.addColorStop(0,'#f1f3f7');mg.addColorStop(.64,'#e4e9f3');mg.addColorStop(1,'#a5b5cf');b.fillStyle=mg;b.fillRect(x-mr,y-mr,mr*2,mr*2);
 for(let i=0;i<55;i++){let a=r()*6.28,l=Math.sqrt(r())*mr*.96,xx=x+Math.cos(a)*l,yy=y+Math.sin(a)*l,rr=mr*(.025+r()*.24);glow(b,xx,yy,rr,[[0,`rgba(67,85,121,${.026+r()*.10})`],[.56,'rgba(81,98,130,.027)'],[1,'rgba(65,83,122,0)']]);}
 for(let i=0;i<950;i++){let xx=x+(r()*2-1)*mr,yy=y+(r()*2-1)*mr;b.fillStyle=r()>.5?'rgba(255,255,255,.045)':'rgba(52,75,109,.045)';b.fillRect(xx,yy,.7+r()*.8,.7+r()*.8);}b.restore();
 // Successive mountain ranges, receding into the night haze.
 mountain(b,[[0,.52],[.1,.49],[.17,.51],[.23,.47],[.29,.495],[.36,.46],[.42,.51],[.49,.53],[.57,.48],[.65,.43],[.72,.49],[.78,.465],[.86,.51],[.93,.47],[1,.49]],'#14243b');
 mountain(b,[[0,.51],[.07,.475],[.12,.505],[.18,.535],[.24,.515],[.30,.56],[.36,.545],[.42,.58],[.50,.552],[.57,.57],[.65,.53],[.71,.55],[.78,.49],[.84,.53],[.9,.46],[1,.52]],'#0c192c');
 mountain(b,[[0,.435],[.06,.47],[.11,.48],[.19,.53],[.24,.54],[.31,.59],[.40,.605],[.5,.628],[.59,.59],[.67,.59],[.75,.55],[.81,.51],[.87,.49],[.93,.42],[1,.46]],'#080f20');
 mountain(b,[[0,.535],[.07,.55],[.14,.58],[.21,.59],[.29,.622],[.41,.635],[.58,.635],[.68,.612],[.77,.59],[.84,.57],[.93,.555],[1,.52]],'#050d19');
 let water=b.createLinearGradient(0,lake,0,h);water.addColorStop(0,'#101e34');water.addColorStop(.24,'#0a1629');water.addColorStop(.7,'#050d1b');water.addColorStop(1,'#02050d');b.fillStyle=water;b.fillRect(0,lake,w,h-lake);b.fillStyle='rgba(111,139,181,.10)';b.fillRect(w*.22,lake,w*.56,.65);
 ripples=[];for(let i=0;i<160;i++){let t=r(),yy=lake+t*(h-lake),xx=r()*w;ripples.push({x:xx,y:yy,ww:mix(4,65,t)*(.3+r()),a:.015+r()*.075,p:r()*6.28,s:.12+r()*.28,ref:false});}
 for(let i=0;i<115;i++){let t=r(),yy=lake+3+t*(h-lake)*.94,spread=moon.r*(.28+t*1.12),xx=moon.x+(r()*2-1)*spread;ripples.push({x:xx,y:yy,ww:(3+r()*19)*(1+t*1.4),a:(.17+r()*.23)*(1-t*.73)*(1-Math.abs(xx-moon.x)/(spread*1.3)),p:r()*6.28,s:.25+r()*.35,ref:true});}
 // Dark forest shores frame the still water without crowding the sky.
 let front='#02060e',mid='#050b16';
 fill(f,[[0,h*.692],[w*.08,h*.711],[w*.16,h*.732],[w*.22,h*.77],[w*.27,h*.84],[w*.13,h],[0,h]],mid);
 fill(f,[[w,h*.68],[w*.93,h*.705],[w*.86,h*.73],[w*.8,h*.77],[w*.75,h*.84],[w*.88,h],[w,h]],mid);
 for(let i=0;i<23;i++){let t=r(),xx=w*t*.235,yy=h*(.70+.13*t),s=(.04+r()*.105)*Math.min(h,w*1.85);pine(f,xx,yy,s,mid,200+i);}
 for(let i=0;i<25;i++){let t=r(),xx=w*(1-t*.24),yy=h*(.69+.15*t),s=(.04+r()*.115)*Math.min(h,w*1.85);pine(f,xx,yy,s,mid,500+i);}
 fill(f,[[0,h*.825],[w*.055,h*.85],[w*.12,h*.878],[w*.19,h*.91],[w*.27,h*.98],[w*.33,h],[0,h]],front);
 fill(f,[[w,h*.81],[w*.95,h*.84],[w*.885,h*.88],[w*.83,h*.93],[w*.72,h],[w,h]],front);
 let scale=Math.min(h,w*1.9);for(let [xx,yy,ss] of [[-.018,.94,.32],[.045,.92,.24],[.12,.97,.155],[.18,.995,.10],[1.014,.94,.34],[.945,.92,.25],[.88,.97,.17],[.82,.995,.10]])pine(f,xx*w,yy*h,ss*scale,front,Math.floor((xx+1)*1000));
 let vign=f.createRadialGradient(w*.52,h*.43,Math.min(w,h)*.18,w*.5,h*.5,Math.hypot(w,h)*.62);vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(.7,'rgba(0,0,0,.05)');vign.addColorStop(1,'rgba(0,0,0,.55)');f.fillStyle=vign;f.fillRect(0,0,w,h);
 draw(0);
}
function draw(t){if(!w||!h)return;g.drawImage(bg,0,0,w,h);
 for(let a of stars){let opacity=a.a*(.82+.18*Math.sin(t*a.v+a.p));g.globalAlpha=opacity;g.fillStyle=a.c;g.beginPath();g.arc(a.x,a.y,a.s,0,6.283);g.fill();if(a.s>1.26){g.globalAlpha=opacity*.28;g.fillRect(a.x-2.7,a.y-.25,5.4,.5);g.fillRect(a.x-.25,a.y-2.7,.5,5.4);}}
 g.globalAlpha=1;
 for(let a of ripples){let pulse=.68+.32*Math.sin(t*a.s+a.p),len=a.ww*(.82+.18*Math.sin(t*.23+a.p)),xx=a.x+Math.sin(t*.18+a.p)*3;g.strokeStyle=a.ref?`rgba(191,210,246,${a.a*pulse})`:`rgba(104,143,194,${a.a*pulse})`;g.lineWidth=a.ref?.8:.65;g.beginPath();g.moveTo(xx-len/2,a.y);g.lineTo(xx+len/2,a.y);g.stroke();}g.drawImage(fg,0,0,w,h);}
 function tick(ts){if(!start)start=ts;draw((ts-start)/1000);frame=requestAnimationFrame(tick);}
 function motion(){cancelAnimationFrame(frame);start=0;if(!reduced.matches&&!document.hidden)frame=requestAnimationFrame(tick);else draw(0);}
 addEventListener('resize',setup,{passive:true});reduced.addEventListener('change',motion);document.addEventListener('visibilitychange',motion);setup();motion();
})();
</script>
</body>
</html>
