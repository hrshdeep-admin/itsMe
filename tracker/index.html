<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#182239">
<meta name="description" content="Tracker — your private, fixed daily rhythm and check-in tracker.">
<title>Tracker · Daily Rhythm</title>
<style>
:root{
  --bg:#142035;--shell:#1c2c44;--card:#233750;
  --line:#455770;--ink:#f4f4f7;--muted:#bdc8d8;--accent:#a6eee0;
  --mint:#b9ebcf;--violet:#d5c4ff;--red:#ffb8bf;
  --nav:#1a2a40ee;--control:#293950;--shadow:0 18px 45px #060f253a;
  --hero1:#275768;--hero2:#444671;--hero3:#625079;
  --ink-on-accent:#113e43;--accent-glow:#a6eee02e;
  --ok:#52d9a0;--ok-soft:#52d9a030;--ok-ink:#0b3526;--ok-glow:#52d9a04d;
  --warn:#ffd25e;--warn-soft:#ffd25e30;--warn-ink:#4a3600;--warn-glow:#ffd25e4d;
  --bad:#ff808f;--bad-soft:#ff808f30;--bad-ink:#4a0f1b;--bad-glow:#ff808f4d;
}
html[data-theme="day"]{
  color-scheme:light;
  --bg:#eee9df;--shell:#faf4e9;--card:#fff9ef;
  --line:#d8d0c5;--ink:#2b354a;--muted:#5d6b7b;--accent:#356d68;
  --mint:#3b7b62;--violet:#685a96;--red:#b25469;
  --nav:#f9f3e9ee;--control:#f3ebdf;--shadow:0 12px 32px #7d77641b;
  --hero1:#b4ded9;--hero2:#d7d6f0;--hero3:#f0ced0;
  --ink-on-accent:#fbfff8;--accent-glow:#356d6829;
  --ok:#2f9d6f;--ok-soft:#2f9d6f26;--ok-ink:#ffffff;--ok-glow:#2f9d6f44;
  --warn:#e0a712;--warn-soft:#e0a71230;--warn-ink:#3b2b00;--warn-glow:#e0a71244;
  --bad:#d64a60;--bad-soft:#d64a6026;--bad-ink:#ffffff;--bad-glow:#d64a6044;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;min-height:100dvh;font:400 14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
body:before{content:"";position:fixed;z-index:-1;pointer-events:none;inset:0;background:radial-gradient(ellipse 62% 33% at 100% 5%,#ac8cc834,transparent 75%),radial-gradient(ellipse 78% 40% at 0% 75%,#5db8a529,transparent 80%)}
body.dialog-open{overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.container{width:min(calc(100% - 24px),680px);margin-inline:auto}

/* Top bar */
.topbar{position:sticky;top:0;z-index:15;background:var(--nav);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.topbar-in{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.identity{display:flex;align-items:center;gap:10px;min-width:0}
.brand-icon{height:32px;width:32px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#94e8c8,#c7c7ff);color:#224553;font-size:23px;line-height:1;box-shadow:0 5px 20px #46b9a128}
.identity b{font-size:19px;letter-spacing:-.06em;line-height:1}
.identity small{display:block;margin-top:4px;font-size:8px;letter-spacing:.19em;color:var(--muted);font-weight:800}
.header-actions{display:flex;align-items:center;gap:7px}
.icon-button{width:37px;height:37px;border:1px solid var(--line);border-radius:11px;background:var(--control);color:var(--ink);display:grid;place-items:center;font-size:17px}
.icon-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Date + totals */
.datebar{padding:14px 0 12px}
.datebar h1{margin:0;font-size:clamp(22px,5vw,30px);line-height:1.1;letter-spacing:-.05em}
.scorestrip{margin-bottom:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.score{min-width:0;padding:10px 12px 11px;border:1px solid var(--line);border-radius:15px;background:var(--shell);box-shadow:var(--shadow);position:relative;overflow:hidden}
.score:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--mint)}
.score.fail:before{background:var(--red)}.score.pending:before{background:var(--violet)}
.score .number{display:block;font-size:26px;line-height:1.05;font-weight:900;letter-spacing:-.07em;font-variant-numeric:tabular-nums;transform-origin:left center}
.score .label{display:block;font-size:10px;margin-top:6px;color:var(--muted);font-weight:650}
.score.done .number{color:var(--mint)}.score.fail .number{color:var(--red)}.score.pending .number{color:var(--violet)}
.number.bump{animation:bump .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}

/* Compact focus card */
.focus{position:relative;overflow:hidden;isolation:isolate;border-radius:20px;padding:13px 15px 14px;border:1px solid #b3d7e176;background:linear-gradient(127deg,var(--hero1) 2%,var(--hero2) 60%,var(--hero3));box-shadow:var(--shadow)}
.focus:before{content:"";position:absolute;z-index:-1;right:-60px;top:-70px;width:170px;height:170px;border:1px solid #ffffff52;border-radius:50%;box-shadow:0 0 0 22px #ffffff0c,0 0 0 48px #ffffff08}
html[data-theme="day"] .focus{color:#263d4f;border-color:#aabdc8}
.focus-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.focus-label{display:inline-flex;align-items:center;gap:7px;letter-spacing:.14em;font-size:9px;text-transform:uppercase;font-weight:900;color:#d5fff4}
.focus-label:before{content:"";height:6px;width:6px;border-radius:50%;background:#a8ffcf;box-shadow:0 0 0 3px #a8ffcf30}
html[data-theme="day"] .focus-label{color:#30635b}html[data-theme="day"] .focus-label:before{background:#448b77;box-shadow:0 0 0 3px #448b7720}
.focus-right{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;color:#d8e3eb;font-variant-numeric:tabular-nums}
html[data-theme="day"] .focus-right{color:#43606d}
.fstatus{border-radius:99px;padding:1px 8px;font-size:9px;font-weight:900;background:#ffffff38}
.focus-main{display:flex;align-items:center;gap:11px;margin-top:9px}
.focus-icon{flex-shrink:0;display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:#ffffff32;border:1px solid #ffffff3b;font-size:22px}
.focus h2{margin:0;font-size:clamp(20px,5.2vw,26px);line-height:1.12;letter-spacing:-.045em;font-weight:900;overflow-wrap:anywhere}
.focus .note{margin:2px 0 0;font-size:11px;color:#e1e8ef;line-height:1.35}
html[data-theme="day"] .focus .note{color:#435363}
.clockrow{margin-top:11px;display:flex;align-items:center;justify-content:space-between;gap:7px;font-size:10px;font-weight:800;font-variant-numeric:tabular-nums}
.progress-track{margin-top:6px;height:6px;border-radius:99px;background:#ffffff50;overflow:hidden}
.progress-track i{display:block;height:100%;width:0;background:#b5ffde;border-radius:inherit;transition:width .4s ease}
html[data-theme="day"] .progress-track{background:#ffffff9e}html[data-theme="day"] .progress-track i{background:#337d6b}

/* My Entire Day */
.day-section{margin-top:20px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.section-title h2{font-size:15px;margin:0;letter-spacing:-.03em;font-weight:900}
.jump{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:var(--control);color:var(--ink);font-size:10px;font-weight:850}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.lg{font-size:10px;font-weight:850;padding:3px 9px;border-radius:99px}
.lg.ok{background:var(--ok-soft);color:var(--ok)}.lg.warn{background:var(--warn-soft);color:var(--warn)}.lg.bad{background:var(--bad-soft);color:var(--bad)}
.legend small{font-size:10px;color:var(--muted);margin-left:2px}
.day-list{display:grid;gap:7px}
.row{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:var(--shell);padding:8px 9px;transition:background .3s,border-color .3s,box-shadow .3s}
.row::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transform:translateX(-100%)}
.row.flash-full::after{background:linear-gradient(100deg,transparent 15%,#52d9a0aa 50%,transparent 85%);animation:sweep .9s ease-out}
.row.flash-half::after{background:linear-gradient(100deg,transparent 15%,#ffd25eaa 50%,transparent 85%);animation:sweep .8s ease-out}
.row.flash-none::after{background:linear-gradient(100deg,transparent 15%,#ff808f88 50%,transparent 85%);animation:sweep .7s ease-out}
@keyframes sweep{0%{opacity:0;transform:translateX(-100%)}20%{opacity:1}100%{opacity:0;transform:translateX(100%)}}
.row.shake{animation:shake .42s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.row-main{display:flex;align-items:center;gap:8px}
.info{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:0;min-height:44px;background:none;border:0;color:inherit;text-align:left}
.ricon{flex-shrink:0;width:34px;height:34px;border-radius:11px;background:var(--control);display:grid;place-items:center;font-size:18px;transition:background .3s}
.rtext{min-width:0}
.rname{display:block;font-size:13px;font-weight:850;line-height:1.25;letter-spacing:-.01em}
.rtime{display:block;margin-top:2px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.nowpill{display:none;margin-left:6px;font-style:normal;font-size:8px;font-weight:900;letter-spacing:.12em;padding:1px 6px;border-radius:99px;background:var(--accent);color:var(--ink-on-accent);vertical-align:1px}
.acts{display:flex;gap:6px;flex-shrink:0}
.act{position:relative;width:35px;height:35px;border-radius:11px;display:grid;place-items:center;font-size:17px;font-weight:900;line-height:1;padding:0;background:var(--cs);color:var(--c);border:1.5px solid var(--cl);transition:background .2s,color .2s,box-shadow .25s,border-color .2s}
.act.full{--c:var(--ok);--cs:var(--ok-soft);--cl:var(--ok);--ci:var(--ok-ink);--cg:var(--ok-glow)}
.act.half{--c:var(--warn);--cs:var(--warn-soft);--cl:var(--warn);--ci:var(--warn-ink);--cg:var(--warn-glow)}
.act.none{--c:var(--bad);--cs:var(--bad-soft);--cl:var(--bad);--ci:var(--bad-ink);--cg:var(--bad-glow)}
.act.half::after{content:"½";position:absolute;right:3px;bottom:1px;font-size:8px;font-weight:900}
.act.sel{background:var(--c);color:var(--ci);border-color:transparent;box-shadow:0 0 0 3px var(--cg),0 6px 16px var(--cg)}
.act.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.act.pop span{display:inline-block;animation:glyph .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(.68)}65%{transform:scale(1.3) rotate(-6deg)}100%{transform:scale(1)}}
@keyframes glyph{0%{transform:scale(.2) rotate(-60deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.row.past .info{opacity:.5;filter:grayscale(.85)}
.row.past:not(.marked) .rtime:after{content:" · not logged"}
.row.current{padding:12px 10px;border:2px solid var(--accent);background:linear-gradient(125deg,var(--hero1),var(--hero2) 70%,var(--hero3));animation:pulse 2.6s ease-in-out infinite;box-shadow:0 0 0 4px var(--accent-glow),var(--shadow)}
html[data-theme="day"] .row.current{color:#263d4f}
.row.current .rname{font-size:15.5px}
.row.current .rtime{color:inherit;opacity:.82;font-weight:700}
.row.current .ricon{width:40px;height:40px;font-size:22px;background:#ffffff38}
.row.current .act{width:40px;height:40px;font-size:19px}
.row.current .nowpill{display:inline-block}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--accent-glow),var(--shadow)}50%{box-shadow:0 0 0 8px transparent,var(--shadow)}}
.rremark{display:block;width:100%;margin-top:6px;padding:6px 10px;border-radius:9px;border:1px dashed var(--bad);background:var(--bad-soft);color:var(--ink);font-size:11px;text-align:left;overflow-wrap:anywhere}
.rremark.empty{color:var(--muted)}
.rdetail{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:12px;line-height:1.6}
.rdetail p{margin:6px 0 4px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:3px 8px;font-size:10px;font-weight:900;background:#d9e1ff;color:#475c8e}
.tag.outside{background:#cbeddf;color:#28624d}
.packing{padding:10px 12px;border-radius:12px;background:var(--control);margin-top:8px}
.packing strong{display:block;font-size:12px;margin-bottom:4px}
.packrow{display:flex;gap:9px;align-items:center;padding:5px 0;font-size:12px}
.packrow input{width:17px;height:17px;accent-color:#3e8675;margin:0;flex-shrink:0}
.signoff{display:none;margin:16px 0 0}.signoff.show{display:block}
.signoff button{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--shell);color:var(--ink);padding:13px;font-weight:800}
.footer{margin:24px 0 22px;text-align:center;font-size:10px;color:var(--muted)}

/* Remark sheet */
.backdrop{display:none;position:fixed;inset:0;background:#080f23bd;z-index:40;align-items:flex-end;justify-content:center;backdrop-filter:blur(7px)}
.backdrop.open{display:flex}
.sheet{width:min(100%,510px);max-height:calc(100dvh - 24px);overflow:auto;background:var(--shell);border:1px solid var(--line);border-radius:23px 23px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -14px 58px #060c214a;animation:rise .18s ease-out}
.handle{width:34px;height:4px;background:var(--line);border-radius:99px;margin:-4px auto 14px}
.kicker{font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:850;color:var(--muted)}
.sheet h2{margin:3px 0 4px;font-size:22px;letter-spacing:-.05em;line-height:1.15}
.sheet p{margin:0 0 12px;font-size:11px;color:var(--muted)}
textarea{width:100%;resize:vertical;min-height:88px;max-height:200px;border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--control);color:var(--ink);font-size:13px;outline:none}
textarea::placeholder{color:var(--muted)}
.sheet-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:9px;margin-top:12px}
.sheet-actions button{min-height:46px;border-radius:12px;font-weight:900;font-size:14px;border:1px solid var(--line);background:var(--control);color:var(--ink)}
.sheet-actions .save{background:var(--accent);color:var(--ink-on-accent);border-color:transparent}
@keyframes rise{from{transform:translateY(25px);opacity:.5}to{transform:translateY(0);opacity:1}}

/* Effects + toast */
.fx{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden}
.fx-p{position:absolute;will-change:transform,opacity}
.fx-ring{position:absolute;width:30px;height:30px;border-radius:50%;border:3px solid;transform:translate(-50%,-50%)}
.toast{position:fixed;z-index:90;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;padding:10px 16px;border-radius:12px;background:#e7f4e5;color:#24534b;box-shadow:0 12px 36px #05102040;font-weight:850;font-size:12px;text-align:center;max-width:90vw}
.toast.warn{background:#fff1c7;color:#5b4300}.toast.bad{background:#ffe0e4;color:#7a2335}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:365px){.container{width:calc(100% - 16px)}.identity small{letter-spacing:.11em}.score .number{font-size:22px}.act{width:32px;height:32px}.row.current .act{width:36px;height:36px}.acts{gap:4px}.ricon{width:30px;height:30px;font-size:16px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<nav class="topbar" aria-label="Main navigation"><div class="container topbar-in">
  <div class="identity"><div class="brand-icon" aria-hidden="true">✳</div><div><b>tracker</b><small>MAKE TODAY COUNT</small></div></div>
  <div class="header-actions">
    <button type="button" class="icon-button" id="themeSwitch" title="Toggle day/night colors" aria-label="Toggle day/night colors">☼</button>
    <button type="button" class="icon-button" id="downloadBtn" title="Download today's JSON" aria-label="Download today's JSON"><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 17v3h14v-3"/></svg></button>
  </div>
</div></nav>

<main class="container">
  <header class="datebar"><h1 id="dateLabel">Loading…</h1></header>

  <section class="scorestrip" aria-label="Daily totals">
    <div class="score done"><strong id="countDone" class="number">0</strong><span class="label">Done</span></div>
    <div class="score fail"><strong id="countNotDone" class="number">0</strong><span class="label">Not done</span></div>
    <div class="score pending"><strong id="countRemaining" class="number">0</strong><span class="label">Remaining</span></div>
  </section>

  <section class="focus" aria-label="Current scheduled activity">
    <div class="focus-top">
      <span class="focus-label" id="liveState">CURRENT FOCUS</span>
      <span class="focus-right"><span id="focusStatus" class="fstatus" hidden></span><span id="blockIndex">— / —</span></span>
    </div>
    <div class="focus-main">
      <span class="focus-icon" id="activeIcon" aria-hidden="true">✦</span>
      <div><h2 id="activeTitle">Loading…</h2><p class="note" id="activeNote"></p></div>
    </div>
    <div class="clockrow"><span id="activeTime">—</span><span id="remainingTime">—</span></div>
    <div class="progress-track"><i id="timeFill"></i></div>
  </section>

  <section class="day-section" aria-label="My entire day">
    <div class="section-title"><h2>My Entire Day</h2><button type="button" class="jump" id="jumpNow">Now ↓</button></div>
    <div class="legend">
      <span class="lg ok">✓ Done</span><span class="lg warn">✓ 50%+</span><span class="lg bad">✕ Not done</span>
      <small>Tap a name for details · tap a result again to clear</small>
    </div>
    <div class="day-list" id="dayList"></div>
  </section>

  <div class="signoff" id="signoff"><button type="button" id="signoffBtn">↧ &nbsp; Download today's JSON</button></div>
  <footer class="footer">TRACKER · One task, one window, one decision.</footer>
</main>

<div class="backdrop" id="remarkBackdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="remarkHeading">
  <div class="handle"></div>
  <span class="kicker">NOT DONE</span>
  <h2 id="remarkHeading">What got in the way?</h2>
  <p id="remarkSub">—</p>
  <textarea id="remarkText" placeholder="A quick note for future you… (optional)"></textarea>
  <div class="sheet-actions"><button type="button" id="remarkSkip">Skip</button><button type="button" class="save" id="remarkSave">Save remark</button></div>
</div></div>

<div class="fx" id="fx" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

const KEY='dayflow.tracker.v3',OLD_KEY='javlin.daily.v2',THEME_KEY='javlin.theme';
const SIGN_OFF_MIN=20*60+45;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const todayKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateFromKey=k=>new Date(`${k}T12:00:00`);
const modeOf=k=>{const d=dateFromKey(k).getDay();return d>=1&&d<=4?'A':'B'}; // Mon–Thu = A, Fri–Sun = B
const getSchedule=k=>SCHEDULES[modeOf(k)];
const timeString=m=>{const h=Math.floor(m/60)%24;return `${h%12||12}:${pad(m%60)} ${h<12?'AM':'PM'}`};
const time24=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const rangeOf=t=>`${timeString(t.start)} – ${t.overnight?'next morning':timeString(t.end)}`;
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tagOf=t=>t.tag||(t.location==='Home'?'H':'O');
const tagMarkup=t=>`<span class="tag ${tagOf(t)==='H'?'':'outside'}">${tagOf(t)} · ${tagOf(t)==='H'?'Home':'Outside'}</span>`;
const fmtLeft=m=>m>=60?`${Math.floor(m/60)}h ${m%60}m left`:`${m} min left`;
const RESULT_LABEL={full:'Done',half:'50%+ done',none:'Not done'};

/* ---------- Storage (results: full | half | none) ---------- */
function migrate(old){
  const s={version:3,days:{}};
  for(const [date,day] of Object.entries(old?.days||{})){
    const entries={};
    for(const [id,e] of Object.entries(day?.entries||{})){
      if(!e)continue;
      const st=e.status,pc=Number(e.completionPercent);
      if(st==='Completed'||(st==='Done'&&(!Number.isFinite(pc)||pc>=85)))entries[id]={r:'full',remarks:'',at:e.savedAt};
      else if(st==='Done'||st==='Partially Completed')entries[id]={r:'half',remarks:'',at:e.savedAt};
      else if((st==='Not Done'||st==='Not Attempted')&&e.remarks)entries[id]={r:'none',remarks:String(e.remarks),at:e.savedAt}; // empty Not Done = old auto-close, leave unmarked
    }
    s.days[date]={entries,packing:day?.packing||{}};
  }
  return s;
}
function loadStore(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY)||'null');
    if(raw&&raw.days&&typeof raw.days==='object')return raw;
    const old=JSON.parse(localStorage.getItem(OLD_KEY)||'null');
    return old?migrate(old):{version:3,days:{}};
  }catch{return {version:3,days:{}}}
}
let store=loadStore();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));return true}catch{showToast('Storage unavailable — not saved','warn');return false}}
const dayOf=k=>store.days[k]||(store.days[k]={entries:{},packing:{}});
const entriesOf=k=>store.days[k]?.entries||{};
const packOf=(k,id)=>store.days[k]?.packing?.[id]||{};
function statsFor(sched,entries){
  let full=0,half=0,none=0;
  for(const t of sched){const r=entries[t.id]?.r;if(r==='full')full++;else if(r==='half')half++;else if(r==='none')none++}
  const total=sched.length;
  return {full,half,none,done:full+half,notDone:none,remaining:total-full-half-none,total,score:total?Math.round((full*100+half*50)/total):0};
}

/* ---------- Toast + effects ---------- */
let toastTimer;
function showToast(msg,kind=''){const el=$('toast');el.textContent=msg;el.className='toast show '+kind;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
const fx=$('fx');
function burst(x,y,{colors,n,dist,size=8}){
  for(let i=0;i<n;i++){
    const p=document.createElement('i');p.className='fx-p';
    const w=size*(.6+Math.random()*.8),h=w*(Math.random()<.5?1:.45);
    p.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${colors[i%colors.length]};border-radius:${Math.random()<.4?'50%':'2px'}`;
    fx.appendChild(p);
    const a=Math.random()*Math.PI*2,d=dist*(.45+Math.random()*.75);
    const dx=Math.cos(a)*d,dy=Math.sin(a)*d-dist*.25,rot=(Math.random()-.5)*720;
    const an=p.animate([
      {transform:'translate(-50%,-50%) scale(.3)',opacity:1},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(${rot/2}deg) scale(1)`,opacity:1,offset:.55},
      {transform:`translate(calc(-50% + ${dx*1.1}px),calc(-50% + ${dy+70}px)) rotate(${rot}deg) scale(.7)`,opacity:0}
    ],{duration:850+Math.random()*450,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
    an.onfinish=()=>p.remove();
  }
}
function ring(x,y,color){
  const r=document.createElement('i');r.className='fx-ring';r.style.cssText=`left:${x}px;top:${y}px;border-color:${color}`;fx.appendChild(r);
  const an=r.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:.9},{transform:'translate(-50%,-50%) scale(3.2)',opacity:0}],{duration:600,easing:'ease-out',fill:'forwards'});
  an.onfinish=()=>r.remove();
}
function rain(){
  const colors=['#52d9a0','#a6eee0','#ffd25e','#d5c4ff','#ffc8ad','#ffffff','#ff808f'];
  for(let i=0;i<110;i++){
    const p=document.createElement('i');p.className='fx-p';
    const w=6+Math.random()*6;
    p.style.cssText=`left:${Math.random()*innerWidth}px;top:-14px;width:${w}px;height:${w*(Math.random()<.5?1:.5)}px;background:${colors[i%colors.length]};border-radius:${Math.random()<.3?'50%':'2px'}`;
    fx.appendChild(p);
    const sway=(Math.random()-.5)*160,rot=(Math.random()-.5)*900;
    const an=p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${sway}px,${innerHeight+40}px) rotate(${rot}deg)`,opacity:1}],{duration:2000+Math.random()*1800,delay:Math.random()*600,easing:'cubic-bezier(.3,.1,.6,1)',fill:'both'});
    an.onfinish=()=>p.remove();
  }
}
function restartClass(el,cls,ms){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms)}
const WINS=['Done and dusted ✓','Crushed it 🔥','That\'s how it\'s done 💪','Another one down 🎯','Locked in ✨'];
const HALVES=['Solid progress — over halfway 👏','Good push. Keep the momentum.','Most of it done. Nice.'];
function celebrate(btn,row,r,streak){
  try{navigator.vibrate&&navigator.vibrate(r==='full'?[18,40,18]:r==='half'?12:30)}catch{}
  restartClass(btn,'pop',550);
  restartClass(row,'flash-'+r,950);
  if(r==='none')restartClass(row,'shake',450);
  if(reduceMotion)return;
  const b=btn.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2;
  if(r==='full'){ring(x,y,'#52d9a0');burst(x,y,{colors:['#52d9a0','#a6eee0','#ffd25e','#b9ebcf','#ffffff','#d5c4ff'],n:30,dist:100})}
  else if(r==='half'){ring(x,y,'#ffd25e');burst(x,y,{colors:['#ffd25e','#ffe9a3','#ffc8ad'],n:14,dist:62,size:7})}
}

/* ---------- List ---------- */
let viewKey=todayKey();
function rowMarkup(t,key){
  const packs=t.packing?.length?`<div class="packing"><strong>🎒 Pack before leaving</strong>${t.packing.map((p,i)=>`<label class="packrow"><input type="checkbox" data-pack="${safe(t.id)}" data-index="${i}" ${packOf(key,t.id)[i]?'checked':''}><span>${safe(p)}</span></label>`).join('')}</div>`:'';
  return `<article class="row" data-id="${safe(t.id)}">
    <div class="row-main">
      <button type="button" class="info" aria-expanded="false"><span class="ricon" aria-hidden="true">${safe(t.icon)}</span><span class="rtext"><span class="rname">${safe(t.title)}</span><span class="rtime">${safe(rangeOf(t))}<em class="nowpill">NOW</em></span></span></button>
      <div class="acts" role="group" aria-label="Result for ${safe(t.title)}">
        <button type="button" class="act full" data-r="full" aria-pressed="false" aria-label="Done, 100%" title="Done"><span>✓</span></button>
        <button type="button" class="act half" data-r="half" aria-pressed="false" aria-label="More than 50% done" title="50%+ done"><span>✓</span></button>
        <button type="button" class="act none" data-r="none" aria-pressed="false" aria-label="Not done" title="Not done"><span>✕</span></button>
      </div>
    </div>
    <button type="button" class="rremark" hidden></button>
    <div class="rdetail" hidden>${tagMarkup(t)}<p>${safe(t.details||t.note||'')}</p>${packs}</div>
  </article>`;
}
function buildList(){
  const sched=getSchedule(viewKey);
  $('dayList').innerHTML=sched.map(t=>rowMarkup(t,viewKey)).join('');
  firstScrollDone=false;
}
let firstScrollDone=false;
function jumpNow(smooth=true){
  const cur=document.querySelector('#dayList .row.current')||document.querySelector('#dayList .row:not(.past)');
  if(cur)cur.scrollIntoView({behavior:smooth&&!reduceMotion?'smooth':'auto',block:'center'});
}
const lastCounts={};
function setCount(id,val){
  const el=$(id),v=String(val);
  if(el.textContent===v)return;
  const had=lastCounts[id]!==undefined;
  el.textContent=v;lastCounts[id]=v;
  if(had)restartClass(el,'bump',600);
}
function update(){
  const now=new Date(),key=todayKey(now);
  if(key!==viewKey){viewKey=key;buildList()}
  const sched=getSchedule(key),entries=entriesOf(key),st=statsFor(sched,entries);
  const nm=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;

  $('dateLabel').textContent=dateFromKey(key).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
  setCount('countDone',st.done);setCount('countNotDone',st.notDone);setCount('countRemaining',st.remaining);

  const rows=$('dayList').children;
  let curIdx=-1;
  sched.forEach((t,i)=>{
    const row=rows[i];if(!row)return;
    const isCur=nm>=t.start&&nm<t.end,isPast=nm>=t.end;
    if(isCur)curIdx=i;
    row.classList.toggle('current',isCur);
    row.classList.toggle('past',isPast);
    const e=entries[t.id],r=e?.r;
    row.classList.toggle('marked',!!r);
    row.querySelectorAll('.act').forEach(b=>{const on=b.dataset.r===r;b.classList.toggle('sel',on);b.setAttribute('aria-pressed',String(on))});
    const rem=row.querySelector('.rremark');
    if(r==='none'){
      rem.hidden=false;
      const txt=e.remarks||'';
      rem.classList.toggle('empty',!txt);
      rem.textContent=txt?`“${txt}”`:'+ Add a reason (optional)';
    }else rem.hidden=true;
  });

  // Focus card
  const cur=curIdx>=0?sched[curIdx]:null;
  $('liveState').textContent=cur?'CURRENT FOCUS':'BETWEEN TASKS';
  $('blockIndex').textContent=`${pad(curIdx>=0?curIdx+1:0)} / ${pad(sched.length)}`;
  const fs=$('focusStatus'),cr=cur?entries[cur.id]?.r:null;
  fs.hidden=!cr;if(cr)fs.textContent=(cr==='none'?'✕ ':'✓ ')+RESULT_LABEL[cr];
  if(cur){
    $('activeIcon').textContent=cur.icon;$('activeTitle').textContent=cur.title;$('activeNote').textContent=cur.note||'';
    $('activeTime').textContent=rangeOf(cur);
    const left=Math.max(1,Math.ceil(cur.end-nm));
    $('remainingTime').textContent=fmtLeft(left);
    $('timeFill').style.width=`${Math.max(0,Math.min(100,100*(nm-cur.start)/(cur.end-cur.start)))}%`;
  }else{
    const nxt=sched.find(t=>nm<t.start);
    $('activeIcon').textContent='🌙';$('activeTitle').textContent=nxt?'Rest up':'Day wrapped';
    $('activeNote').textContent=nxt?`Next: ${nxt.title} · ${timeString(nxt.start)}`:'Nothing left on today\'s schedule.';
    $('activeTime').textContent='Free window';$('remainingTime').textContent='—';$('timeFill').style.width='0%';
  }
  $('signoff').classList.toggle('show',nm>=SIGN_OFF_MIN);
  if(!firstScrollDone){firstScrollDone=true;setTimeout(()=>jumpNow(false),120)}
}

/* ---------- Actions ---------- */
function applyResult(key,task,r){
  const d=dayOf(key),prev=d.entries[task.id]?.r;
  if(prev===r){delete d.entries[task.id];persist();return null}
  d.entries[task.id]={r,remarks:'',at:new Date().toISOString()};
  persist();return r;
}
function onAct(btn){
  const row=btn.closest('.row'),key=viewKey,sched=getSchedule(key);
  const idx=sched.findIndex(t=>t.id===row.dataset.id),task=sched[idx];
  if(!task)return;
  const before=statsFor(sched,entriesOf(key)).remaining;
  const res=applyResult(key,task,btn.dataset.r);
  update();
  if(!res){showToast('Cleared');return}
  const entries=entriesOf(key);
  let streak=0;for(let j=idx;j>=0&&entries[sched[j].id]?.r==='full';j--)streak++;
  celebrate(btn,row,res);
  const st=statsFor(sched,entries);
  if(res==='full')showToast(streak>=3?`🔥 ${streak} in a row!`:WINS[Math.floor(Math.random()*WINS.length)],'');
  else if(res==='half')showToast(HALVES[Math.floor(Math.random()*HALVES.length)],'warn');
  else{showToast('Logged. Tomorrow is a fresh shot.','bad');setTimeout(()=>openRemark(task),420)}
  if(res!=='none'&&before>0&&st.remaining===0){
    setTimeout(()=>{
      if(!reduceMotion)rain();
      showToast(st.full===st.total?'Perfect day — every task nailed 🏆':'Day fully logged — nice work 🎉','');
    },600);
  }
}
let remarkTask=null;
function openRemark(task){
  remarkTask=task;
  const e=entriesOf(viewKey)[task.id];
  $('remarkSub').textContent=`${task.title} · ${rangeOf(task)}`;
  $('remarkText').value=e?.remarks||'';
  $('remarkBackdrop').classList.add('open');document.body.classList.add('dialog-open');
  setTimeout(()=>$('remarkText').focus(),60);
}
function closeRemark(save){
  if(!remarkTask)return;
  if(save){
    const e=entriesOf(viewKey)[remarkTask.id];
    if(e&&e.r==='none'){e.remarks=$('remarkText').value.trim();persist()}
  }
  remarkTask=null;
  $('remarkBackdrop').classList.remove('open');document.body.classList.remove('dialog-open');
  update();
}

$('dayList').addEventListener('click',e=>{
  const act=e.target.closest('.act');
  if(act){onAct(act);return}
  const rem=e.target.closest('.rremark');
  if(rem){const row=rem.closest('.row'),t=getSchedule(viewKey).find(t=>t.id===row.dataset.id);if(t)openRemark(t);return}
  const info=e.target.closest('.info');
  if(info){
    const row=info.closest('.row'),d=row.querySelector('.rdetail');
    d.hidden=!d.hidden;info.setAttribute('aria-expanded',String(!d.hidden));
  }
});
$('dayList').addEventListener('change',e=>{
  if(!e.target.matches('[data-pack]'))return;
  const id=e.target.dataset.pack,i=Number(e.target.dataset.index),d=dayOf(viewKey);
  d.packing[id]={...(d.packing[id]||{}),[i]:e.target.checked};persist();
});
$('remarkSave').addEventListener('click',()=>closeRemark(true));
$('remarkSkip').addEventListener('click',()=>closeRemark(false));
$('remarkBackdrop').addEventListener('click',e=>{if(e.target===$('remarkBackdrop'))closeRemark(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&remarkTask)closeRemark(false)});
$('jumpNow').addEventListener('click',()=>jumpNow(true));

/* ---------- Export + theme ---------- */
function exportDay(){
  const date=todayKey(),sched=getSchedule(date),entries=entriesOf(date),stats=statsFor(sched,entries);
  const status={full:'Done',half:'Partially Done',none:'Not Done'},pct={full:100,half:50};
  const obj={app:'Tracker',schemaVersion:4,date,dayType:modeOf(date)==='A'?'Mon–Thu schedule':'Fri–Sun schedule',exportedAt:new Date().toISOString(),summary:stats,
    schedule:sched.map(t=>({id:t.id,title:t.title,tag:tagOf(t),start:time24(t.start),end:t.overnight?'Next morning':time24(t.end),...(t.packing?{packingItems:t.packing}:{})})),
    entries:Object.fromEntries(sched.map(t=>{
      const e=entries[t.id],b={taskTitle:t.title,status:e?status[e.r]:'Unmarked',remarks:e?.remarks||''};
      if(e&&pct[e.r])b.completionPercent=pct[e.r];
      if(e?.at)b.recordedAt=e.at;
      if(t.packing)b.packedItems=packOf(date,t.id);
      return [t.id,b];
    }))};
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`tracker-${date}.json`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  showToast('Daily JSON downloaded ✓');
}
function setTheme(theme){
  document.documentElement.dataset.theme=theme;
  $('themeSwitch').textContent=theme==='night'?'☼':'☾';
  $('themeSwitch').setAttribute('aria-label',`Switch to ${theme==='night'?'day':'night'} mode`);
  document.querySelector('meta[name="theme-color"]').content=theme==='night'?'#1a2a40':'#f9f3e9';
  try{localStorage.setItem(THEME_KEY,theme)}catch{}
}
$('downloadBtn').addEventListener('click',exportDay);
$('signoffBtn').addEventListener('click',exportDay);
$('themeSwitch').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='day'?'night':'day'));

try{setTheme(localStorage.getItem(THEME_KEY)||'night')}catch{setTheme('night')}
persist();
buildList();
update();
setInterval(update,15000);
</script>
