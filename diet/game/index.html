<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#181410; --bg2:#211a13; --card:#2a2118; --board:#3a2c1d;
  --cream:#f4ead9; --muted:#b3a289; --saffron:#f2a93b; --herb:#93b26d;
  --tomato:#e2593f; --line:rgba(244,234,217,0.1);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; min-height:100%; font-family:'Work Sans',sans-serif; color:var(--cream);
  background:
    radial-gradient(ellipse at 20% -10%, #3a2c1d55, transparent 60%),
    radial-gradient(ellipse at 100% 110%, #f2a93b22, transparent 55%),
    linear-gradient(160deg,var(--bg2),var(--bg));
  display:flex; flex-direction:column; align-items:center; min-height:100vh;
  padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
}
@media (prefers-reduced-motion:no-preference){
  .card{animation:riseIn .5s cubic-bezier(.2,.8,.2,1);}
}
@keyframes riseIn{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}

.top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;}
.brand{display:flex;align-items:center;gap:9px;}
.brand .mark{font-size:22px;}
.brand h1{font-family:'Fraunces',serif;font-weight:700;font-size:19px;margin:0;letter-spacing:.2px;}
.awake{font-size:11px;color:var(--herb);display:flex;align-items:center;gap:5px;opacity:.85;}
.awake .dot{width:6px;height:6px;border-radius:50%;background:var(--herb);box-shadow:0 0 8px var(--herb);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

.xp{font-size:13px;color:var(--saffron);font-weight:600;white-space:nowrap;}

.progwrap{width:100%;max-width:520px;margin-bottom:22px;}
.progbar{height:8px;border-radius:20px;background:var(--card);overflow:hidden;border:1px solid var(--line);}
.progfill{height:100%;background:linear-gradient(90deg,var(--herb),var(--saffron));border-radius:20px;transition:width .5s cubic-bezier(.2,.8,.2,1);}
.progtext{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;}

.card{
  width:100%;max-width:520px;flex:1;
  background:
    repeating-linear-gradient(100deg, #00000012 0 2px, transparent 2px 26px),
    linear-gradient(160deg,var(--board),var(--card));
  border:1px solid var(--line); border-radius:26px; padding:30px 26px 26px;
  box-shadow:0 20px 50px -20px #000000aa, inset 0 1px 0 #ffffff0d;
  display:flex; flex-direction:column; min-height:340px; position:relative;
}
.tasknum{font-family:'Fraunces',serif;font-size:14px;color:var(--saffron);font-weight:600;letter-spacing:.3px;}
.taskicon{font-size:44px;margin:14px 0 8px;}
.tasktitle{font-family:'Fraunces',serif;font-size:28px;font-weight:700;line-height:1.15;margin:0 0 16px;}
.items{list-style:none;padding:0;margin:0 0 6px;display:flex;flex-direction:column;gap:9px;}
.items li{
  display:flex; align-items:center; gap:10px; font-size:15px; color:var(--cream);
  background:#00000022; border:1px solid var(--line); border-radius:12px; padding:10px 13px;
}
.items li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--herb);flex:none;}
.doneflag{
  position:absolute; top:22px; right:24px; background:var(--herb); color:#182013; font-weight:700;
  font-size:12px; padding:5px 11px; border-radius:20px; opacity:0; transform:scale(.8);
  transition:.25s;
}
.doneflag.show{opacity:1;transform:scale(1);}

.spacer{flex:1;}

.actions{width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-top:18px;}
.btn{
  border:none; border-radius:18px; padding:19px 10px; font-family:'Work Sans',sans-serif; font-weight:700;
  font-size:17px; cursor:pointer; -webkit-tap-highlight-color:transparent; transition:transform .12s, filter .12s;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn:active{transform:scale(.96);}
.btn-back{background:var(--card); color:var(--cream); border:1px solid var(--line);}
.btn-done{background:linear-gradient(135deg,var(--herb),#6f9552); color:#132014; box-shadow:0 10px 26px -10px #93b26d88;}
.btn:disabled{opacity:.35; cursor:default;}

.steps-fab{
  margin-top:14px; background:none; border:1px solid var(--line); color:var(--muted); font-family:'Work Sans',sans-serif;
  font-size:13px; padding:9px 18px; border-radius:20px; cursor:pointer; display:flex; align-items:center; gap:7px;
}
.steps-fab:hover{color:var(--cream); border-color:var(--saffron);}

.overlay{
  position:fixed; inset:0; background:#100c08e8; backdrop-filter:blur(4px); display:none;
  align-items:flex-end; justify-content:center; z-index:50;
}
.overlay.open{display:flex;}
.sheet{
  width:100%; max-width:560px; max-height:80vh; background:var(--bg2); border-radius:24px 24px 0 0;
  border:1px solid var(--line); border-bottom:none; padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));
  overflow-y:auto; animation:up .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:'Fraunces',serif;margin:0 0 14px;font-size:19px;display:flex;justify-content:space-between;align-items:center;}
.sheet h2 button{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}
.steprow{
  display:flex; align-items:center; gap:12px; padding:12px 8px; border-bottom:1px solid var(--line);
  cursor:pointer;
}
.steprow.current{background:#f2a93b14; border-radius:12px;}
.check{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--herb); flex:none; display:flex; align-items:center;
  justify-content:center; font-size:13px; color:#132014; cursor:pointer;
}
.check.done{background:var(--herb);}
.steprow .stitle{flex:1; font-size:14.5px;}
.steprow.rowdone .stitle{color:var(--muted); text-decoration:line-through; text-decoration-color:#b3a28966;}

.confetti{position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden;}
.piece{position:absolute; top:-16px; border-radius:2px; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:.3;}}

.complete{
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  flex:1; gap:10px; padding:20px 0;
}
.complete .big{font-size:60px;}
.complete h2{font-family:'Fraunces',serif; font-size:26px; margin:6px 0 2px;}
.complete p{color:var(--muted); font-size:14px; margin:0;}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><span class="mark">🍲</span><h1>Kitchen Manual</h1></div>
  <div style="text-align:right">
    <div class="xp" id="xp">0 XP</div>
    <div class="awake"><span class="dot"></span><span id="awakeLabel">staying awake</span></div>
  </div>
</div>

<div class="progwrap">
  <div class="progbar"><div class="progfill" id="progfill" style="width:0%"></div></div>
  <div class="progtext"><span id="progtext">0 of 17 done</span><span id="progpct">0%</span></div>
</div>

<div class="card" id="card"></div>

<div class="actions" id="actions">
  <button class="btn btn-back" id="btnBack">← Back</button>
  <button class="btn btn-done" id="btnDone">Done ✓</button>
</div>

<button class="steps-fab" id="btnSteps">☰ All steps</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2>17 Steps <button id="closeSheet">✕</button></h2>
    <div id="stepList"></div>
  </div>
</div>

<div class="confetti" id="confetti"></div>

<script>
const TASKS=[
{icon:"🧽",title:"Wash Utensils",items:["2 Shakers","2 Lunch Boxes","2 Plates for Dinner","2 Spoons + 2 Forks","2 Yogurt Containers","1 Washing Container (Rice + Quinoa + Daal)","1 Dry Veggie Storage Box","1 Wet Veggie Storage Box (later: Breakfast Mix)","2 Small Storage (Pumpkin Seeds + Supplements + Almonds)"]},
{icon:"🌾",title:"Cook Quinoa",items:["100g Quinoa","200g Water"]},
{icon:"🥦",title:"Chop & Air Fry Broccoli for Dinner",items:[]},
{icon:"🍚",title:"Cook Rice",items:["120g Rice","240g Water","1 tsp Salt"]},
{icon:"🧅",title:"Chop & Mix Dry Veggies",items:["Onions","Cilantro","Spinach","Bell Peppers"]},
{icon:"🍅",title:"Chop & Mix Wet Veggies",items:["Tomatoes","Jalapenos","Lime","Corn"]},
{icon:"🥗",title:"Split Wet Veggies into Lunch Bowls",items:["Half into lunch bowls"]},
{icon:"🫘",title:"Cook Beans & Tofu",items:["Beans","Tofu","Seasoning"]},
{icon:"🥣",title:"Beans into Remaining Wet Veggie Bowls",items:[]},
{icon:"🌱",title:"Cook Soya Chunks & Air Fry",items:[]},
{icon:"🥤",title:"Make Protein Shake",items:["Scoop of Whey","Milk"]},
{icon:"💊",title:"Pack Supplements",items:["Selenium tablet","Omega","Vitamin D","Almonds","Pumpkin Seeds"]},
{icon:"🧂",title:"Make Creatine Packs",items:[]},
{icon:"🍦",title:"Make Yogurt",items:["Yogurt","Berries","Chia Seeds"]},
{icon:"🥛",title:"Make Dahi for Dinner",items:[]},
{icon:"🍱",title:"Lunch Bowls to Fridge",items:["Quinoa","Wet Veggies","Soy Chunks"]},
{icon:"🧹",title:"Clean & Put Away",items:[]},
];
const TOTAL=TASKS.length;
let done=new Array(TOTAL).fill(false);
let current=0, xp=0;

const card=document.getElementById('card');
const actions=document.getElementById('actions');
const btnBack=document.getElementById('btnBack');
const btnDone=document.getElementById('btnDone');
const btnSteps=document.getElementById('btnSteps');
const overlay=document.getElementById('overlay');
const closeSheet=document.getElementById('closeSheet');
const stepList=document.getElementById('stepList');
const progfill=document.getElementById('progfill');
const progtext=document.getElementById('progtext');
const progpct=document.getElementById('progpct');
const xpEl=document.getElementById('xp');

function doneCount(){return done.filter(Boolean).length;}

function findNextUndone(from){
  for(let i=from+1;i<TOTAL;i++) if(!done[i]) return i;
  for(let i=0;i<=from;i++) if(!done[i]) return i;
  return -1;
}
function findPrevUndone(from){
  for(let i=from-1;i>=0;i--) if(!done[i]) return i;
  for(let i=TOTAL-1;i>=from;i--) if(!done[i]) return i;
  return -1;
}

function updateProgress(){
  const c=doneCount(), pct=Math.round((c/TOTAL)*100);
  progfill.style.width=pct+"%";
  progtext.textContent=c+" of "+TOTAL+" done";
  progpct.textContent=pct+"%";
  xpEl.textContent=xp+" XP";
}

function render(){
  if(doneCount()===TOTAL){ renderComplete(); return; }
  const t=TASKS[current];
  card.innerHTML=`
    <div class="tasknum">TASK ${current+1} OF ${TOTAL}</div>
    <div class="doneflag ${done[current]?'show':''}">✓ DONE</div>
    <div class="taskicon">${t.icon}</div>
    <h2 class="tasktitle">${t.title}</h2>
    ${t.items.length?`<ul class="items">${t.items.map(i=>`<li>${i}</li>`).join('')}</ul>`:''}
    <div class="spacer"></div>
  `;
  actions.style.display='grid';
  btnBack.disabled = findPrevUndone(current)===-1 && done.filter(Boolean).length===0;
  updateProgress();
  renderStepList();
}

function renderComplete(){
  card.innerHTML=`
    <div class="complete">
      <div class="big">🎉</div>
      <h2>Kitchen fully prepped</h2>
      <p>All ${TOTAL} tasks done · ${xp} XP earned</p>
    </div>`;
  actions.style.display='none';
  updateProgress();
  renderStepList();
  burstConfetti(60);
}

function renderStepList(){
  stepList.innerHTML=TASKS.map((t,i)=>`
    <div class="steprow ${i===current?'current':''} ${done[i]?'rowdone':''}" data-idx="${i}">
      <div class="check ${done[i]?'done':''}" data-check="${i}">${done[i]?'✓':''}</div>
      <div class="stitle">${i+1}. ${t.title}</div>
    </div>`).join('');
}

stepList.addEventListener('click',(e)=>{
  const checkIdx=e.target.getAttribute('data-check');
  if(checkIdx!==null){
    const i=parseInt(checkIdx);
    done[i]=!done[i];
    if(done[i]) xp+=15; else xp=Math.max(0,xp-15);
    if(done[i]) burstConfetti(18);
    render();
    return;
  }
  const row=e.target.closest('.steprow');
  if(row){
    current=parseInt(row.getAttribute('data-idx'));
    overlay.classList.remove('open');
    render();
  }
});

btnDone.onclick=()=>{
  if(!done[current]){ done[current]=true; xp+=15; burstConfetti(28); }
  const nxt=findNextUndone(current);
  if(nxt===-1){ render(); } else { current=nxt; render(); }
};

btnBack.onclick=()=>{
  const prv=findPrevUndone(current);
  if(prv!==-1){ current=prv; render(); }
};

btnSteps.onclick=()=>{ renderStepList(); overlay.classList.add('open'); };
closeSheet.onclick=()=>overlay.classList.remove('open');
overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.classList.remove('open'); });

function burstConfetti(n){
  const box=document.getElementById('confetti');
  const colors=['#f2a93b','#93b26d','#e2593f','#f4ead9'];
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    p.className='piece';
    const size=5+Math.random()*6;
    p.style.width=size+'px'; p.style.height=(size*1.4)+'px';
    p.style.left=(Math.random()*100)+'vw';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration=(1.4+Math.random()*1.1)+'s';
    p.style.opacity=0.9;
    box.appendChild(p);
    setTimeout(()=>p.remove(),2600);
  }
}

// Wake Lock
let wakeLock=null;
const awakeLabel=document.getElementById('awakeLabel');
async function requestWakeLock(){
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    awakeLabel.textContent='staying awake';
    wakeLock.addEventListener('release', ()=>{ awakeLabel.textContent='screen may sleep'; });
  }catch(err){
    awakeLabel.textContent='wake lock unavailable';
  }
}
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState==='visible') await requestWakeLock();
});
requestWakeLock();

render();
</script>
</body>
</html>
