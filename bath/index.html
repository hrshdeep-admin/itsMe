
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a20">
<title>Ritual 30 — Personal Maintenance</title>

<style>
:root {
  --bg: #101a20;
  --panel: #1b292f;
  --panel2: #23353b;
  --line: #34464b;
  --text: #f0f5f2;
  --muted: #9badae;
  --accent: #b9f29d;
  --accent2: #7cbb9e;
  --warning: #e9c58b;
}
* { box-sizing: border-box; }
html,body { margin:0; width:100%; height:100%; }
body {
  font-family: system-ui,-apple-system,Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
}
button { font:inherit; cursor:pointer; }
button:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:4px;
}
.app {
  height:100vh;
  height:100dvh;
  max-width:530px;
  margin:auto;
  display:flex;
  flex-direction:column;
  padding:env(safe-area-inset-top) 18px
          env(safe-area-inset-bottom);
  overflow:hidden;
}
.topbar {
  min-height:70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.brand {
  display:flex;
  align-items:center;
  gap:11px;
}
.brand-icon {
  width:40px;height:40px;
  background:var(--accent);
  color:var(--bg);
  border-radius:13px;
  display:grid;
  place-items:center;
  font-weight:900;
  letter-spacing:-2px;
}
.brand-name { font-size:17px; font-weight:800; letter-spacing:.5px; }
.brand-small {
  color:var(--muted);
  font-size:10px;
  letter-spacing:2px;
  margin-top:3px;
}
.icon-btn {
  width:43px;height:43px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:13px;
  display:grid;
  place-items:center;
  font-size:21px;
}
.day-header {
  padding:8px 1px 13px;
  display:flex;
  justify-content:space-between;
  align-items:end;
}
.eyebrow {
  color:var(--accent2);
  letter-spacing:2px;
  font-size:10px;
  font-weight:750;
  text-transform:uppercase;
}
.day-title {
  margin:5px 0 2px;
  font-size:27px;
  font-weight:800;
  letter-spacing:-1px;
}
.day-focus {
  font-size:12px;
  color:var(--muted);
}
.shift {
  font-size:10px;
  font-weight:750;
  padding:9px 10px;
  border-radius:9px;
  border:1px solid var(--line);
  color:var(--muted);
  white-space:nowrap;
}
.session-strip {
  padding:12px 14px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  margin-bottom:12px;
}
.session-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
  font-size:11px;
  color:var(--muted);
  font-weight:650;
}
.session-top strong {
  color:var(--text);
  font-variant-numeric:tabular-nums;
}
.progress-track {
  height:5px;
  background:#37484c;
  border-radius:10px;
  overflow:hidden;
}
.progress-fill {
  height:100%;
  width:0%;
  background:var(--accent);
  border-radius:10px;
  transition:width .3s linear;
}
.main-area {
  display:flex;
  flex-direction:column;
  gap:11px;
  flex:1;
  min-height:0;
}
.current-card {
  flex:1;
  min-height:0;
  background:
    radial-gradient(circle at 100% 0%,#28433c 0%,transparent 45%),
    var(--panel);
  border:1px solid #3d5a52;
  border-radius:25px;
  padding:18px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.card-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-shrink:0;
}
.live-label {
  color:var(--accent);
  font-size:10px;
  letter-spacing:2px;
  font-weight:800;
}
.step-count {
  font-size:11px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.timer-area {
  display:flex;
  align-items:center;
  gap:19px;
  padding:14px 0 8px;
  flex-shrink:0;
}
.ring {
  width:132px;
  height:132px;
  position:relative;
  flex-shrink:0;
}
.ring svg {
  width:100%;height:100%;
  transform:rotate(-90deg);
}
.ring-track { stroke:#385048; }
.ring-value {
  stroke:var(--accent);
  stroke-linecap:round;
  transition:stroke-dashoffset .25s linear;
}
.ring-center {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.timer-number {
  font-size:34px;
  font-weight:850;
  letter-spacing:-1.5px;
  font-variant-numeric:tabular-nums;
}
.timer-sub {
  font-size:9px;
  color:var(--muted);
  letter-spacing:1.5px;
  font-weight:700;
}
.timer-side { min-width:0; }
.timer-side .mini {
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
}
.timer-side .big {
  font-size:24px;
  font-weight:800;
  margin-top:6px;
}
.timer-side .note {
  font-size:11px;
  line-height:1.5;
  color:var(--muted);
  margin-top:5px;
}
.task-info {
  border-top:1px solid var(--line);
  padding-top:14px;
  display:flex;
  flex-direction:column;
  min-height:0;
  flex:1;
}
.task-title {
  font-size:clamp(20px,5vw,26px);
  font-weight:800;
  letter-spacing:-.6px;
  line-height:1.14;
  margin:0 0 10px;
  flex-shrink:0;
}
.instructions {
  overflow-y:auto;
  min-height:0;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  padding-right:3px;
}
.instruction-item {
  display:flex;
  gap:10px;
  margin-bottom:10px;
  font-size:13px;
  line-height:1.55;
  color:#d6e2dc;
}
.instruction-dot {
  width:5px;height:5px;
  flex-shrink:0;
  background:var(--accent2);
  border-radius:50%;
  margin-top:8px;
}
.upcoming {
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px 15px;
  background:#18252b;
  border:1px solid var(--line);
  border-radius:17px;
  min-height:74px;
}
.upcoming-label {
  color:var(--muted);
  font-size:10px;
  letter-spacing:1.5px;
  font-weight:800;
  margin-bottom:5px;
}
.upcoming-name {
  font-size:14px;
  font-weight:730;
  line-height:1.3;
}
.upcoming-time {
  white-space:nowrap;
  color:var(--accent2);
  font-size:11px;
  font-weight:750;
}
.controls {
  flex-shrink:0;
  padding-top:12px;
}
.play-button {
  width:100%;
  min-height:62px;
  background:var(--accent);
  border:none;
  border-radius:18px;
  color:#12231b;
  font-weight:850;
  font-size:17px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
}
.play-button:active { transform:scale(.985); }
.play-icon { font-size:22px; }
.bottom-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  min-height:40px;
}
.status {
  color:var(--muted);
  font-size:10px;
  display:flex;
  align-items:center;
  gap:6px;
}
.status-dot {
  width:6px;height:6px;
  border-radius:50%;
  background:var(--warning);
}
.status-dot.good { background:var(--accent); }
.reset-button {
  background:none;
  border:none;
  color:var(--muted);
  font-size:11px;
  padding:10px 0 10px 10px;
}

/* Bottom-sheet menu */
.overlay[hidden] { display:none; }
.overlay {
  position:fixed;
  inset:0;
  background:#020709ba;
  z-index:30;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.sheet {
  width:100%;
  max-width:530px;
  height:min(88dvh,850px);
  background:#19282e;
  border:1px solid #3b5154;
  border-radius:26px 26px 0 0;
  display:flex;
  flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
  animation:slideUp .2s ease-out;
}
@keyframes slideUp {
  from {transform:translateY(30px);opacity:.5}
  to {transform:translateY(0);opacity:1}
}
.sheet-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 20px 14px;
}
.sheet-title {font-size:21px;font-weight:800;}
.tabs {
  display:flex;
  padding:0 14px 12px;
  gap:5px;
  border-bottom:1px solid var(--line);
}
.tab {
  flex:1;
  background:transparent;
  border:1px solid transparent;
  color:var(--muted);
  border-radius:11px;
  padding:11px 3px;
  font-size:11px;
  font-weight:750;
}
.tab.active {
  background:#34483e;
  border-color:#4a6555;
  color:var(--accent);
}
.sheet-content {
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:18px;
  overscroll-behavior:contain;
}
.section-intro {
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin:0 0 16px;
}
.day-picker {
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:5px;
  margin-bottom:17px;
}
.day-choice {
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:9px;
  color:var(--muted);
  padding:11px 0;
  font-size:11px;
  font-weight:800;
}
.day-choice.active {
  color:var(--bg);
  background:var(--accent);
  border-color:var(--accent);
}
.glance-heading {
  margin:0 0 14px;
  font-size:20px;
}
.glance-row {
  display:flex;
  gap:13px;
  padding:15px 0;
  border-bottom:1px solid var(--line);
}
.glance-time {
  width:75px;
  flex-shrink:0;
  color:var(--accent2);
  font-size:11px;
  font-weight:750;
  padding-top:3px;
  font-variant-numeric:tabular-nums;
}
.glance-title {
  font-size:14px;
  font-weight:750;
  margin-bottom:6px;
}
.glance-desc {
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}
.product {
  padding:14px 0;
  border-bottom:1px solid var(--line);
}
.product-name {font-size:14px;font-weight:800;}
.product-use {
  color:var(--accent2);
  font-size:11px;
  margin:5px 0;
  font-weight:700;
}
.product-desc {
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}
.tip {
  border:1px solid var(--line);
  background:var(--panel);
  padding:16px;
  border-radius:15px;
  margin-bottom:11px;
}
.tip-index {
  color:var(--accent);
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
}
.tip-title {
  font-weight:800;
  margin:6px 0;
  font-size:15px;
}
.tip-text {
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}
.info-note {
  background:#30392c;
  border:1px solid #62654a;
  color:#e8ddb3;
  padding:13px;
  border-radius:12px;
  font-size:12px;
  line-height:1.6;
  margin-top:16px;
}

@media(max-height:760px) {
  .topbar {min-height:58px}
  .day-header {padding:4px 0 9px}
  .day-title {font-size:24px}
  .session-strip {padding:9px 12px;margin-bottom:9px}
  .main-area {gap:8px}
  .current-card {padding:13px}
  .timer-area {padding:7px 0;gap:13px}
  .ring {width:105px;height:105px}
  .timer-number {font-size:28px}
  .timer-side .big {font-size:20px}
  .task-info {padding-top:10px}
  .task-title {font-size:20px;margin-bottom:7px}
  .instruction-item {font-size:12px;margin-bottom:7px}
  .upcoming {min-height:62px;padding:10px 12px}
  .play-button {min-height:54px}
  .controls {padding-top:8px}
}
@media(max-width:355px) {
  .ring {width:104px;height:104px}
  .timer-area {gap:10px}
  .day-title {font-size:23px}
  .current-card {padding:12px}
  .timer-side .big {font-size:19px}
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">R.</div>
      <div>
        <div class="brand-name">RITUAL / 30</div>
        <div class="brand-small">PERSONAL MAINTENANCE</div>
      </div>
    </div>
    <button class="icon-btn" id="menuBtn"
      aria-label="Open menu" aria-haspopup="dialog">☰</button>
  </header>

  <section class="day-header">
    <div>
      <div class="eyebrow" id="dateLabel">TODAY</div>
      <h1 class="day-title" id="dayTitle">Monday</h1>
      <div class="day-focus" id="dayFocus"></div>
    </div>
    <div class="shift" id="shiftTag">HOME DAY</div>
  </section>

  <section class="session-strip">
    <div class="session-top">
      <span>SESSION PROGRESS</span>
      <strong id="sessionLeft">30:00 LEFT</strong>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="sessionBar"></div>
    </div>
  </section>

  <main class="main-area">

    <section class="current-card">
      <div class="card-top">
        <span class="live-label" id="stageLabel">● READY TO BEGIN</span>
        <span class="step-count" id="stepCounter">01 / 07</span>
      </div>

      <div class="timer-area">
        <div class="ring">
          <svg viewBox="0 0 132 132" aria-hidden="true">
            <circle class="ring-track" cx="66" cy="66" r="53"
              fill="none" stroke-width="6"/>
            <circle class="ring-value" id="ringValue"
              cx="66" cy="66" r="53"
              fill="none" stroke-width="6"/>
          </svg>
          <div class="ring-center">
            <span class="timer-number" id="timerText">00:00</span>
            <span class="timer-sub">REMAINING</span>
          </div>
        </div>

        <div class="timer-side">
          <div class="mini">CURRENT STAGE</div>
          <div class="big" id="durationLabel">2 MIN</div>
          <div class="note">Next stage starts automatically.</div>
        </div>
      </div>

      <div class="task-info">
        <h2 class="task-title" id="taskTitle"></h2>
        <div class="instructions" id="taskInstructions"></div>
      </div>
    </section>

    <section class="upcoming">
      <div>
        <div class="upcoming-label">UP NEXT</div>
        <div class="upcoming-name" id="upcomingName"></div>
      </div>
      <div class="upcoming-time" id="upcomingTime"></div>
    </section>

  </main>

  <section class="controls">
    <button class="play-button" id="playBtn">
      <span class="play-icon" id="playIcon">▶</span>
      <span id="playText">Begin Ritual</span>
    </button>

    <div class="bottom-row">
      <div class="status">
        <span class="status-dot" id="wakeDot"></span>
        <span id="wakeStatus">Checking screen wake lock</span>
      </div>
      <button class="reset-button" id="resetBtn">
        ↻ Restart today
      </button>
    </div>
  </section>
</div>

<!-- MENU -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true"
       aria-label="Routine information" id="sheet">

    <div class="sheet-head">
      <div class="sheet-title">The Manual</div>
      <button class="icon-btn" id="closeMenu"
        aria-label="Close menu">×</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="glance">Glance</button>
      <button class="tab" data-tab="products">Products needed</button>
      <button class="tab" data-tab="tips">Special tips</button>
    </div>

    <div class="sheet-content" id="sheetContent"></div>
  </div>
</div>

<script>
"use strict";

/* =================================================
   THE SEVEN DAILY ROUTINES
   Durations for each day total exactly 30 minutes.
   ================================================= */

const DAYS = [

  // MONDAY
  {
    name:"Monday",
    focus:"Beard grooming + skin treatment",
    type:"HOME DAY",
    tasks:[
      {
        min:7,
        title:"Shape your beard",
        actions:[
          "Use Philips All-in-One Trimmer Series 5000. Start with a 6 mm guard on both cheeks and a 9 mm guard along jaw and chin.",
          "Use a 5 mm guard for moustache if suitable. Keep both sides symmetrical.",
          "Remove only stray hairs beneath the natural neckline. Avoid cutting over raised white bumps."
        ]
      },
      {
        min:9,
        title:"Wash body + face",
        actions:[
          "Use ATTITUDE Sensitive Skin Body Wash — Unscented. Wash armpits, chest, back, arms, legs, feet and outer groin. Rinse completely.",
          "Use one pump of CeraVe Hydrating Facial Cleanser. Massage forehead, nose, cheeks, chin and beneath beard for 30–45 seconds.",
          "Rinse face with lukewarm water. Pat dry with a clean towel. Never scrub."
        ]
      },
      {
        min:3,
        title:"Hydrate + deodorize",
        actions:[
          "Apply approximately one pump of CeraVe Daily Moisturizing Lotion to face and neck. Spread across forehead, both cheeks, nose, chin and beard skin.",
          "Apply a thin layer of Mitchum Men Advanced Gel Unscented to both completely dry armpits."
        ]
      },
      {
        min:4,
        title:"Teeth + floss",
        actions:[
          "Use Oral-B Glide Comfort Plus Floss between all accessible teeth. Slide gently along each side of the tooth.",
          "Apply a pea-sized amount of Colgate Cavity Protection Fluoride Toothpaste to a soft toothbrush.",
          "Brush all tooth surfaces for 2 minutes. Spit; avoid rinsing immediately."
        ]
      },
      {
        min:3,
        title:"Arrange long hair",
        actions:[
          "Use a wide-tooth comb to detangle hair, starting at the ends and moving upward.",
          "Gather hair loosely and secure with a soft fabric hair tie or make a loose braid.",
          "Do not pull hair tightly backward at the forehead or temples."
        ]
      },
      {
        min:2,
        title:"Monday texture treatment",
        actions:[
          "DAYS 1–14: Skip retinol. Check face for dryness and leave moisturizer undisturbed.",
          "FROM DAY 15, if tolerated: Use one pea-sized amount of CeraVe Resurfacing Retinol Serum over dry, moisturized forehead and cheeks.",
          "Avoid eyelids, eye corners, lips and nostril creases. Stop if persistent irritation develops."
        ]
      },
      {
        min:2,
        title:"Prepare Tuesday clothes",
        actions:[
          "Select one clean shirt, one pair of trousers, fresh underwear and socks for Tuesday.",
          "Fold everything together in one designated location. Put trimmer away clean and dry."
        ]
      }
    ]
  },

  // TUESDAY
  {
    name:"Tuesday",
    focus:"Hair maintenance + fingernails",
    type:"HOME DAY",
    tasks:[
      {
        min:2,
        title:"Prepare equipment",
        actions:[
          "Place clean towel, wide-tooth comb, nail clippers, ATTITUDE Body Wash and CeraVe Cleanser within reach.",
          "Put dirty clothing in laundry."
        ]
      },
      {
        min:11,
        title:"Shower + gentle face wash",
        actions:[
          "Use ATTITUDE Sensitive Skin Body Wash — Unscented on body, including armpits, torso, feet and outer groin.",
          "Use one pump of CeraVe Hydrating Facial Cleanser on forehead, cheeks, nose, chin and beard skin for 30–45 seconds.",
          "Rinse and pat dry. Keep head hair dry today: no shampoo needed."
        ]
      },
      {
        min:3,
        title:"Moisturize skin",
        actions:[
          "Apply one pump of CeraVe Daily Moisturizing Lotion across face, neck and beneath beard.",
          "Apply a little extra lotion to dry elbows or backs of hands if needed.",
          "Apply Mitchum Men Advanced Gel Unscented to completely dry armpits."
        ]
      },
      {
        min:4,
        title:"Clean teeth",
        actions:[
          "Floss between teeth using Oral-B Glide Comfort Plus Floss.",
          "Brush all teeth for 2 minutes with Colgate Cavity Protection Fluoride Toothpaste and a soft toothbrush."
        ]
      },
      {
        min:5,
        title:"Detangle + protect hair",
        actions:[
          "Release your hair tie. Use a wide-tooth comb to gently separate hair, starting with the ends.",
          "If the ends are dry, lightly mist them with clean water. Optionally smooth one drop of pure almond oil over the ends only if previously tolerated.",
          "Secure hair loosely in a low braid or soft tie without pulling at the temples."
        ]
      },
      {
        min:3,
        title:"Maintain fingernails",
        actions:[
          "Use clean nail clippers to trim overgrown fingernails.",
          "Use a nail file to smooth sharp corners. Do not cut cuticles or clip nails unnecessarily short."
        ]
      },
      {
        min:2,
        title:"Prepare Wednesday outfit",
        actions:[
          "Lay out Wednesday's clean shirt, trousers, underwear and socks.",
          "Put nail clippers and comb back in their designated places."
        ]
      }
    ]
  },

  // WEDNESDAY
  {
    name:"Wednesday",
    focus:"Skin barrier + clean bedding",
    type:"HOME DAY",
    tasks:[
      {
        min:2,
        title:"Prepare shower + bedding",
        actions:[
          "Set out clean towel, fresh pillowcase and clean clothes.",
          "Put CeraVe Hydrating Cleanser and ATTITUDE Body Wash within reach."
        ]
      },
      {
        min:10,
        title:"Wash body + face",
        actions:[
          "Use ATTITUDE Sensitive Skin Body Wash — Unscented on armpits, torso, arms, legs, outer groin and feet.",
          "Apply one pump of CeraVe Hydrating Facial Cleanser to forehead, nose, both cheeks, chin and beard skin. Massage gently for 30–45 seconds.",
          "Rinse with lukewarm water and pat dry."
        ]
      },
      {
        min:3,

/* =================================================
   STATE + DATE
   ================================================= */

const STORAGE_KEY = "ritual30-session-v1";
const TOTAL_MS = 30 * 60 * 1000;
const CIRC = 2 * Math.PI * 53;

const $ = id => document.getElementById(id);

function localDateKey() {
  const d = new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

// JS Sunday=0. Our schedule Monday=0.
function todayIndex() {
  return (new Date().getDay()+6)%7;
}

function newSession() {
  const day = todayIndex();
  return {
    date: localDateKey(),
    day,
    index: 0,
    remaining: DAYS[day].tasks[0].min*60000,
    endsAt:0,
    running:false,
    started:false,
    complete:false
  };
}

function loadSession() {
  try {
    const old = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (
      old &&
      old.date === localDateKey() &&
      old.day === todayIndex() &&
      Number.isInteger(old.index) &&
      old.index >= 0 &&
      old.index <= DAYS[old.day].tasks.length &&
      Number.isFinite(old.remaining) &&
      Number.isFinite(old.endsAt)
    ) return old;
  } catch(e) {}
  return newSession();
}

let session = loadSession();
let glanceDay = session.day;

function save() {
  try {
    localStorage.setItem(STORAGE_KEY,JSON.stringify(session));
  } catch(e) {}
}

function currentTasks() {
  return DAYS[session.day].tasks;
}

function remainingNow() {
  if (session.complete) return 0;
  return session.running
    ? Math.max(0,session.endsAt-Date.now())
    : session.remaining;
}

function clock(ms) {
  const s = Math.ceil(Math.max(0,ms)/1000);
  const m = Math.floor(s/60);
  return String(m).padStart(2,"0")+":"+
         String(s%60).padStart(2,"0");
}

function totalRemaining() {
  if(session.complete) return 0;
  let total = remainingNow();
  const tasks = currentTasks();
  for(let i=session.index+1;i<tasks.length;i++) {
    total += tasks[i].min*60000;
  }
  return total;
}

function timeRange(tasks,index) {
  let start = 0;
  for(let i=0;i<index;i++) start+=tasks[i].min;
  let end = start+tasks[index].min;
  return String(start).padStart(2,"0")+":00–"+
         String(end).padStart(2,"0")+":00";
}

/* =================================================
   SOUND ENGINE — ORIGINAL GENTLE CHIME
   ================================================= */

let audioContext = null;

function unlockSound() {
  try {
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx) return;
    if(!audioContext) audioContext=new AudioCtx();
    if(audioContext.state==="suspended") audioContext.resume();
  } catch(e) {}
}

function playChime(finished=false) {
  if(!audioContext) return;

  try {
    if(audioContext.state==="suspended") audioContext.resume();

    const now=audioContext.currentTime;
    const notes=finished
      ? [523.25,659.25,783.99]
      : [659.25,880];

    notes.forEach((freq,i)=>{
      const osc=audioContext.createOscillator();
      const gain=audioContext.createGain();
      const start=now+i*.17;

      osc.type="sine";
      osc.frequency.value=freq;

      gain.gain.setValueAtTime(.0001,start);
      gain.gain.exponentialRampToValueAtTime(.10,start+.025);
      gain.gain.exponentialRampToValueAtTime(.0001,start+.48);

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start(start);
      osc.stop(start+.50);
    });

    if(navigator.vibrate) navigator.vibrate(finished?[100,70,150]:70);
  } catch(e) {}
}

/* =================================================
   ANDROID SCREEN WAKE LOCK
   ================================================= */

let wakeLock=null;
let requestingWake=false;

function wakeStatus(message,good=false) {
  $("wakeStatus").textContent=message;
  $("wakeDot").classList.toggle("good",good);
}

async function requestWakeLock() {
  if(!("wakeLock" in navigator)) {
    wakeStatus("Screen lock control unavailable");
    return;
  }
  if(document.visibilityState!=="visible"||wakeLock||requestingWake) return;

  requestingWake=true;
  try {
    const sentinel=await navigator.wakeLock.request("screen");
    wakeLock=sentinel;
    wakeStatus("Screen awake · supported",true);

    sentinel.addEventListener("release",()=>{
      if(wakeLock===sentinel) wakeLock=null;
      wakeStatus("Wake lock released");
    });
  } catch(e) {
    wakeStatus("Tap Play to enable screen wake");
  } finally {
    requestingWake=false;
  }
}

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible") {
    requestWakeLock();
    tick();
  }
});

document.addEventListener("pointerdown",()=>{
  if(!wakeLock) requestWakeLock();
},{passive:true});

    $("upcomingTime").textContent="✓";

function renderClock() {
  const tasks=currentTasks();
  const remaining=remainingNow();

  $("timerText").textContent=clock(remaining);
  $("sessionLeft").textContent=clock(totalRemaining())+" LEFT";

  const overall=1-totalRemaining()/TOTAL_MS;
  $("sessionBar").style.width=
    (Math.max(0,Math.min(1,overall))*100)+"%";

  let progress=1;

  if(!session.complete) {
    const duration=tasks[session.index].min*60000;
    progress=1-remaining/duration;
  }

  $("ringValue").style.strokeDasharray=CIRC;
  $("ringValue").style.strokeDashoffset=
    CIRC*(1-Math.max(0,Math.min(1,progress)));

  if(session.complete) {
    $("stageLabel").textContent="✓ RITUAL COMPLETE";
    $("playIcon").textContent="↻";
    $("playText").textContent="Start Again";
  } else if(session.running) {
    $("stageLabel").textContent="● STAGE IN PROGRESS";
    $("playIcon").textContent="Ⅱ";
    $("playText").textContent="Pause Routine";
  } else if(session.started) {
    $("stageLabel").textContent="● ROUTINE PAUSED";
    $("playIcon").textContent="▶";
    $("playText").textContent="Resume Routine";
  } else {
    $("stageLabel").textContent="● READY TO BEGIN";
    $("playIcon").textContent="▶";
    $("playText").textContent="Begin 30-Minute Ritual";
  }
}

/* =================================================
   TIMING + AUTOMATIC TRANSITIONS
   Uses real wall-clock time, not tick counting.
   ================================================= */

function advanceIfNeeded() {
  if(!session.running||session.complete) return;

  let changed=false;
  let guard=0;

  while(
    session.running &&
    Date.now()>=session.endsAt &&
    guard++<20
  ) {
    const previousEnd=session.endsAt;
    session.index++;
    changed=true;

    if(session.index>=currentTasks().length) {
      session.complete=true;
      session.running=false;
      session.remaining=0;
      session.endsAt=0;
      break;
    }

    const duration=currentTasks()[session.index].min*60000;
    session.remaining=duration;
    session.endsAt=previousEnd+duration;
  }

  if(changed) {
    save();
    renderStage();
    if(document.visibilityState==="visible") {
      playChime(session.complete);
    }
  }
}

function tick() {
  if(session.date!==localDateKey()&&!session.running) {
    session=newSession();
    glanceDay=session.day;
    save();
    renderStage();
  }

  advanceIfNeeded();
  renderClock();
}

function startPause() {
  unlockSound();
  requestWakeLock();

  if(session.complete) {
    session=newSession();
    renderStage();
  }

  if(session.running) {
    session.remaining=Math.max(0,session.endsAt-Date.now());
    session.running=false;
    session.endsAt=0;
  } else {
    session.endsAt=Date.now()+session.remaining;
    session.running=true;
    session.started=true;
    playChime();
  }

  save();
  tick();
}

function restartToday() {
  if(session.started&&!session.complete) {
    if(!confirm("Restart today's entire 30-minute routine?")) return;
  }
  session=newSession();
  glanceDay=session.day;
  save();
  renderStage();
}

$("playBtn").addEventListener("click",startPause);
$("resetBtn").addEventListener("click",restartToday);

let activeTab="glance";

function openMenu(tab="glance") {
  activeTab=tab;
  glanceDay=session.day;
  $("overlay").hidden=false;
  document.body.style.overflow="hidden";
  updateMenu();
  $("closeMenu").focus();
}

function closeMenu() {
  $("overlay").hidden=true;
  document.body.style.overflow="";
  $("menuBtn").focus();
}

function updateMenu() {
  document.querySelectorAll(".tab").forEach(button=>{
    button.classList.toggle("active",button.dataset.tab===activeTab);
  });

  const content=$("sheetContent");

  if(activeTab==="glance") {
    const day=DAYS[glanceDay];

    const dayButtons=DAYS.map((d,i)=>
      `<button class="day-choice ${i===glanceDay?"active":""}"
        data-day="${i}" aria-label="${d.name}">
        ${d.name.slice(0,2)}
      </button>`
    ).join("");

    const schedule=day.tasks.map((task,i)=>
      `<article class="glance-row">
        <div class="glance-time">${timeRange(day.tasks,i)}</div>
        <div>
          <div class="glance-title">${task.title}</div>
          <div class="glance-desc">
            ${task.actions.join("<br><br>")}
          </div>
        </div>
      </article>`
    ).join("");

    content.innerHTML=`
      <p class="section-intro">
        All seven schedules available for inspection.
        Previewing a day does not change your running timer.
      </p>
      <div class="day-picker">${dayButtons}</div>
      <h3 class="glance-heading">${day.name} · 30 minutes</h3>
      <p class="section-intro">${day.focus}</p>
      ${schedule}
    `;

    content.querySelectorAll("[data-day]").forEach(button=>{
      button.addEventListener("click",()=>{
        glanceDay=Number(button.dataset.day);
        updateMenu();
      });
    });

  } else if(activeTab==="products") {

    content.innerHTML=`
      <p class="section-intro">
        Your fixed weekly personal-care kit.
        Buy once, keep products organized, use only when scheduled.
      </p>
      ${PRODUCTS.map((product,i)=>`
        <article class="product">
          <div class="product-name">${i+1}. ${product.name}</div>
          <div class="product-use">${product.use}</div>
          <div class="product-desc">${product.desc}</div>
        </article>
      `).join("")}

      <h3 class="glance-heading" style="margin-top:25px">
        Reusable tools
      </h3>
      ${TOOLS.map(tool=>`
        <div class="product-desc" style="padding:7px 0">
          • ${tool}
        </div>
      `).join("")}

      <div class="info-note">
        Eye sensitivity: check product labels for ingredients you
        have reacted to, introduce new products separately,
        and stop any product that causes eye watering.
        The retinol is optional and should not be used as
        a substitute for assessment of persistent milia.
      </div>
    `;

  } else {

    content.innerHTML=`
      <p class="section-intro">
        Seven practical principles for your skin,
        long hair, beard and dusty work environment.
      </p>
      ${TIPS.map((tip,i)=>`
        <article class="tip">
          <div class="tip-index">
            FIELD NOTE ${String(i+1).padStart(2,"0")}
          </div>
          <div class="tip-title">${tip.title}</div>
          <div class="tip-text">${tip.desc}</div>
        </article>
      `).join("")}
    `;
  }

  content.scrollTop=0;
}

$("menuBtn").addEventListener("click",()=>openMenu("glance"));
$("closeMenu").addEventListener("click",closeMenu);

$("overlay").addEventListener("click",event=>{
  if(event.target===$("overlay")) closeMenu();
});

document.querySelectorAll(".tab").forEach(button=>{
  button.addEventListener("click",()=>{
    activeTab=button.dataset.tab;
    updateMenu();
  });
});

document.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&!$("overlay").hidden) closeMenu();
});

/* =================================================
   INITIALIZATION
   ================================================= */

save();
renderStage();
tick();

// Check actual elapsed time 4 times per second.
setInterval(tick,250);

// Request immediately, and retry on user interaction.
requestWakeLock();

// Reconcile elapsed time after switching back to the tab.
window.addEventListener("pageshow",tick);

</script>
</body>
</html>
