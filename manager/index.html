<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#281322">
  <meta name="description" content="Mr. Manager — your personal command centre, dressed for royalty.">
  <title>Mr. Manager — The Royal Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --wine: #451d35;
      --wine-deep: #291424;
      --rose: #ad6278;
      --cream: #fffaf0;
      --paper: #f5ebdb;
      --gold: #ad8242;
      --gold-bright: #d4ad68;
      --ink: #432a38;
      --serif: "Cormorant Garamond", Georgia, serif;
      --script: "Great Vibes", "Snell Roundhand", "Apple Chancery", cursive;
      --sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-width: 280px; min-height: 100%; }
    body {
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(circle at 15% 12%, #76415d 0, transparent 33%),
        radial-gradient(circle at 95% 90%, #65394d 0, transparent 34%),
        repeating-linear-gradient(45deg, transparent 0 39px, #f5c77a07 39px 40px),
        var(--wine-deep);
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image: radial-gradient(#f0cb88 0.8px, transparent 1px);
      background-size: 22px 22px;
    }
    .page {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(8px, 2.1vmin, 26px);
    }
    .folio {
      isolation: isolate;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.4dvh, 17px);
      width: min(1130px, 100%);
      height: min(790px, 100%);
      min-height: 0;
      padding: clamp(19px, 3vw, 35px);
      overflow: hidden;
      border: 1px solid #f3d5a1;
      border-radius: clamp(19px, 3vw, 29px);
      background:
        radial-gradient(ellipse at 50% -12%, #fffef5 10%, transparent 68%),
        radial-gradient(ellipse at 0% 100%, #ecdcc4bb, transparent 47%),
        radial-gradient(ellipse at 100% 100%, #edddc8b8, transparent 47%),
        var(--paper);
      box-shadow: 0 34px 100px #0a0309b0, 0 1px 0 #fff9 inset;
    }
    .folio::before {
      content: "";
      position: absolute;
      inset: 9px;
      border: 1px solid #ba985777;
      border-radius: inherit;
      pointer-events: none;
      z-index: -1;
    }
    .folio::after {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px solid #ffffff90;
      border-radius: clamp(10px, 2vw, 18px);
      pointer-events: none;
      z-index: -1;
    }
    .botanical {
      position: absolute;
      z-index: -1;
      width: clamp(135px, 25vw, 280px);
      height: auto;
      pointer-events: none;
      opacity: .85;
      filter: drop-shadow(0 8px 3px #9c795713);
    }
    .botanical.left { left: -27px; top: -41px; }
    .botanical.right { right: -27px; top: -41px; transform: scaleX(-1); }
    .botanical.bottom-left { left: -78px; bottom: -145px; transform: rotate(200deg); opacity: .35; }
    .botanical.bottom-right { right: -78px; bottom: -145px; transform: rotate(158deg); opacity: .35; }
    .hero { position: relative; flex: 0 0 auto; text-align: center; z-index: 1; }
    .crest { display: block; height: clamp(24px, 4.5dvh, 37px); width: 62px; margin: 0 auto 1px; overflow: visible; }
    .overline {
      margin: 0;
      font-size: clamp(8px, 1.25dvh, 10px);
      font-weight: 700;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: #986f4b;
    }
    h1 {
      margin: 5px 0 0;
      font-family: var(--script);
      font-weight: 400;
      font-size: clamp(52px, 10dvh, 85px);
      line-height: 1.03;
      color: var(--wine);
      text-shadow: 0 2px 0 #fff9, 0 6px 12px #956b8b1c;
    }
    .rule { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 2px auto 0; width: min(290px, 68%); color: var(--gold); }
    .rule::before, .rule::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg, transparent, #bb9555); }
    .rule::after { transform: rotate(180deg); }
    .rule span { font-family: var(--serif); font-size: 18px; line-height: 1; }
    .collection {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: clamp(9px, 1.4vw, 16px);
      z-index: 1;
    }
    .destination {
      --accent: #8c5069;
      position: relative;
      isolation: isolate;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: clamp(4px, .9dvh, 10px);
      padding: 12px 10px;
      overflow: hidden;
      text-decoration: none;
      color: var(--wine);
      background: linear-gradient(148deg, #fffcf6f2, #fbf0e3ed);
      border: 1px solid #b68a5988;
      border-radius: clamp(13px, 1.3vw, 18px);
      box-shadow: 0 5px 16px #79543712, inset 0 1px 0 #fff;
      transition: background .25s ease, transform .25s ease, box-shadow .25s ease, border-color .25s ease, color .25s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .destination::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid #c7a77655;
      border-radius: inherit;
      pointer-events: none;
    }
    .destination::after {
      content: "❧";
      position: absolute;
      right: -1px;
      bottom: -18px;
      font-family: var(--serif);
      font-size: 77px;
      line-height: 1;
      color: #b08a6a15;
      transform: rotate(-20deg);
      pointer-events: none;
    }
    .index {
      position: absolute;
      top: 13px;
      left: 14px;
      font-family: var(--serif);
      font-size: 14px;
      font-style: italic;
      color: #b48f60;
      line-height: 1;
    }
    .gem {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: clamp(43px, 5.5dvh, 61px);
      height: clamp(43px, 5.5dvh, 61px);
      border: 1px solid color-mix(in srgb, var(--accent) 28%, #efe4d1);
      border-radius: 50%;
      color: var(--accent);
      background: radial-gradient(circle at 30% 24%, #fffdfa, #f5e7dd);
      box-shadow: 0 5px 15px #7a4a4e15, inset 0 0 0 4px #fff9;
      transition: transform .35s ease, border-color .35s ease, background .35s ease;
    }
    .gem svg { width: 52%; height: 52%; stroke-width: 1.65; }
    .name {
      position: relative;
      z-index: 1;
      font-family: var(--serif);
      font-size: clamp(18px, 2vw, 27px);
      font-weight: 700;
      line-height: 1.08;
      text-align: center;
      white-space: normal;
      text-wrap: balance;
    }
    .micro-star { display: block; position: absolute; top: 15px; right: 15px; color: #ba986e; font-size: 10px; transition: transform .25s ease; }
    .destination:hover, .destination:focus-visible {
      outline: none;
      transform: translateY(-3px);
      background: linear-gradient(145deg, #582842, #371d31);
      border-color: var(--gold-bright);
      color: #fff7e7;
      box-shadow: 0 12px 28px #57243f47, 0 0 0 2px #e1c18d55;
    }
    .destination:hover .index, .destination:focus-visible .index,
    .destination:hover .micro-star, .destination:focus-visible .micro-star { color: #e9ca93; }
    .destination:hover .gem, .destination:focus-visible .gem {
      transform: rotate(-7deg) scale(1.08);
      border-color: #deb976;
      color: #f5deb0;
      background: #6b3a52;
    }
    .destination:hover .micro-star, .destination:focus-visible .micro-star { transform: rotate(80deg); }
    .destination:active { transform: scale(.97); }
    .destination:nth-child(1) { --accent: #a45972; }
    .destination:nth-child(2) { --accent: #437b82; }
    .destination:nth-child(3) { --accent: #85639a; }
    .destination:nth-child(4) { --accent: #946f3a; }
    .destination:nth-child(5) { --accent: #658764; }
    .destination:nth-child(6) { --accent: #a15c66; }
    .destination:nth-child(7) { --accent: #6e749d; }
    .destination:nth-child(8) { --accent: #677e97; }
    .destination:nth-child(9) { --accent: #a16a53; }
    .destination:nth-child(10) { --accent: #6e8e72; }
    .destination:nth-child(11) { --accent: #946baa; }
    .last-row-center { grid-column: 3 / 5; }
    /* The eleventh card receives a wider feature slot on large screens. */
    .last-row-center .gem { width: clamp(43px, 5.5dvh, 61px); height: clamp(43px, 5.5dvh, 61px); }
    .touch-bloom {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #dfb77c75;
      opacity: .8;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      animation: bloom .55s ease-out forwards;
      z-index: -1;
    }
    @keyframes bloom { to { opacity: 0; transform: translate(-50%, -50%) scale(19); } }
    @media (max-width: 760px) {
      .folio { gap: 11px; }
      .collection { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); }
      .last-row-center { grid-column: auto; }
    }
    @media (max-width: 560px) {
      .page { padding: 7px; }
      .folio { height: 100%; gap: clamp(8px, 1.3dvh, 13px); padding: 12px 13px 13px; border-radius: 20px; }
      .folio::before { inset: 6px; }
      .folio::after { inset: 10px; }
      .botanical { width: 133px; opacity: .65; }
      .botanical.left { top: -36px; left: -32px; }
      .botanical.right { top: -36px; right: -32px; }
      .botanical.bottom-left, .botanical.bottom-right { display: none; }
      .crest { height: clamp(21px, 3.3dvh, 28px); }
      .overline { font-size: 8px; letter-spacing: .25em; }
      h1 { font-size: clamp(40px, 7.7dvh, 67px); margin-top: 3px; }
      .rule { margin-top: 0; width: 46%; }
      .rule span { font-size: 15px; }
      .collection {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(6, minmax(0, 1fr));
        gap: clamp(6px, 1dvh, 10px);
      }
      .destination {
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;
        gap: clamp(6px, 2vw, 10px);
        padding: 5px clamp(7px, 2vw, 11px);
        border-radius: 12px;
      }
      .destination::before { inset: 3px; }
      .destination::after { font-size: 45px; right: -3px; bottom: -13px; }
      .gem { width: clamp(31px, 5.1dvh, 43px); height: clamp(31px, 5.1dvh, 43px); }
      .gem svg { width: 55%; height: 55%; }
      .name { font-size: clamp(15px, 3.85vw, 20px); text-align: left; }
      .index { top: 7px; right: 8px; left: auto; font-size: 10px; }
      .micro-star { display: none; }
      .last-row-center { grid-column: 1 / -1; justify-content: center; }
    }
    @media (max-height: 600px) and (max-width: 560px) {
      .folio { padding-top: 9px; padding-bottom: 9px; gap: 6px; }
      .crest { height: 17px; margin-bottom: 0; }
      h1 { font-size: 39px; line-height: 1; margin-top: 0; }
      .rule { display: none; }
      .overline { font-size: 7px; }
      .collection { gap: 5px; }
      .destination { padding: 4px 6px; }
      .gem { width: 28px; height: 28px; }
      .name { font-size: clamp(13px, 4vw, 17px); }
    }
    @media (max-height: 460px) and (min-width: 561px) {
      .folio { padding: 12px; gap: 7px; }
      .crest, .rule, .overline { display: none; }
      h1 { font-size: 40px; margin: 0; }
      .gem { width: 34px; height: 34px; }
      .destination { gap: 1px; }
      .name { font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

  <script>
    // Small touch effect; links remain normal anchors and work without JavaScript.
    document.querySelectorAll('.destination').forEach((link) => {
      link.addEventListener('pointerdown', (event) => {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const bounds = link.getBoundingClientRect();
        const bloom = document.createElement('span');
        bloom.className = 'touch-bloom';
        bloom.style.left = `${event.clientX - bounds.left}px`;
        bloom.style.top = `${event.clientY - bounds.top}px`;
        link.appendChild(bloom);
        bloom.addEventListener('animationend', () => bloom.remove(), { once: true });
      });
    });
  </script>
