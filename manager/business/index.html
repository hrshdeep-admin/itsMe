<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b111b">
  <meta name="description" content="An offline, interactive seven-week founder education program with 28 detailed lessons, worksheets, and progress tracking.">
  <title>Founder OS — Seven-Week Business Academy</title>
  <style>
    :root {
      --bg:#0b111b; --side:#0d1522; --panel:#121e2e; --panel-soft:#162437;
      --panel-raised:#1a2a40; --line:#2a3b51; --line-bright:#395167;
      --text:#edf4fb; --muted:#a6b9cd; --subtle:#7890a8;
      --mint:#78ebc5; --mint-dark:#193d38; --blue:#93b9ff;
      --amber:#f2c887; --purple:#c7aff9; --red:#ffabb5;
      --shadow:0 16px 45px rgba(0,0,0,.16);
      --radius:16px;
    }
    [data-theme="light"] {
      --bg:#f3f6fa; --side:#f8fbfe; --panel:#ffffff; --panel-soft:#f6f9fc;
      --panel-raised:#e8f0f8; --line:#d5e0eb; --line-bright:#bdcfdf;
      --text:#152536; --muted:#41586f; --subtle:#637b91;
      --mint:#087957; --mint-dark:#dbf2e9; --blue:#295bc0;
      --amber:#98600a; --purple:#6348a8; --red:#b5394e;
      --shadow:0 16px 42px rgba(29,55,83,.07);
      color-scheme:light;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:92px}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.45}
    button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
    h1,h2,h3,p{margin:0}h1{font-size:clamp(27px,3.25vw,44px);line-height:1.16;letter-spacing:-1.3px}h2{font-size:22px;line-height:1.25;letter-spacing:-.55px}h3{font-size:15px;line-height:1.35}
    p{color:var(--muted)}a{color:var(--blue)}
    .app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
    .sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--line);z-index:25;min-width:0}
    .logo-area{padding:27px 21px 20px;border-bottom:1px solid var(--line)}
    .brand{display:flex;gap:11px;align-items:center}
    .brand-symbol{width:42px;height:42px;display:grid;place-items:center;background:linear-gradient(135deg,#77f0c9,#87b2fc);color:#0c2431;border-radius:13px;font-size:21px;font-weight:900;box-shadow:0 9px 24px #47bdac26;flex-shrink:0}
    .brand-title{font-size:21px;font-weight:840;letter-spacing:-.8px;line-height:1.1}.brand-title span{color:var(--mint)}
    .brand-subtitle{font-size:10px;font-weight:800;letter-spacing:1.55px;color:var(--subtle);margin-top:3px}

    .side-link:hover{background:var(--panel-soft);color:var(--text)}.side-link.active{background:var(--mint-dark);border-color:color-mix(in srgb,var(--mint) 30%,transparent);color:var(--text)}
    .side-link .side-icon{width:18px;text-align:center;font-size:16px;flex-shrink:0;color:var(--mint)}
    .side-link .side-name{white-space:nowrap;text-overflow:ellipsis;overflow:hidden;flex:1;min-width:0}

    .side-link .small-dot.partial{background:var(--amber)}.side-link .small-dot.complete{background:var(--mint)}

    .week-label span:last-child{color:var(--mint);font-variant-numeric:tabular-nums}
    .sidebar-footer{border-top:1px solid var(--line);padding:17px 20px 21px;font-size:11px;color:var(--muted)}
    .progress-track{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
    .progress-track>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#75b9fd,var(--mint));border-radius:inherit;transition:width .18s ease}
    .sidebar-footer .progress-track{margin:9px 0}
    .sidebar-footer .footer-caption{font-size:10px;line-height:1.5;color:var(--subtle)}
    .main{width:100%;max-width:1580px;min-width:0;margin:0 auto;padding:0 32px 55px}

    .top-left{display:flex;align-items:center;gap:12px;min-width:0}

    .crumb strong{color:var(--mint);font-weight:850}
    .top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-bright);border-radius:10px;background:var(--panel-soft);color:var(--text);font-size:12px;font-weight:750;padding:10px 13px;min-height:38px;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s}
    .btn:hover:not(:disabled){background:var(--panel-raised);border-color:var(--mint)}
    .btn.primary{border-color:var(--mint);background:var(--mint);color:#09261e}.btn.primary:hover:not(:disabled){filter:brightness(1.1)}

    .btn.ghost{background:transparent}.btn.danger{color:var(--red)}
    .btn.icon-only{padding:9px;min-width:38px;font-size:17px}
    .mobile-menu{display:none}.scrim{display:none}
    .view[hidden]{display:none!important}
    .view{padding-top:24px}
    .hero{border:1px solid var(--line-bright);background:radial-gradient(ellipse 70% 150% at 110% -45%,#1c5a4d 0%,transparent 65%),linear-gradient(115deg,#1b2c42,#122032);border-radius:22px;padding:32px 35px;display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:24px;box-shadow:var(--shadow)}

    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
    .chip{background:var(--panel-raised);border:1px solid var(--line-bright);padding:6px 10px;border-radius:7px;font-size:11px;color:var(--text);font-weight:600}
    [data-theme="light"] .chip{background:#ecf4fa}
    .chip b{color:var(--mint);font-weight:850}
    .ring{--percent:0%;width:137px;height:137px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--mint) var(--percent),var(--line-bright) 0);padding:10px;margin:auto}
    .ring-center{height:100%;width:100%;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center}

    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-top:17px}
    .stat,.panel,.week-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
    .stat{padding:18px 19px;min-width:0}.stat-label{font-size:11px;color:var(--muted);font-weight:600}.stat-value{font-size:26px;line-height:1.2;letter-spacing:-.8px;font-weight:820;margin:6px 0 4px;font-variant-numeric:tabular-nums}.stat-note{font-size:10px;color:var(--subtle)}
    .section-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:29px 0 14px}.section-heading p{font-size:12px;margin-top:4px}
    .section-overline{color:var(--mint);letter-spacing:1.6px;font-weight:850;font-size:10px;margin-bottom:5px;text-transform:uppercase}
    .panel{min-width:0;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:17px 21px;border-bottom:1px solid var(--line)}.panel-head h3{font-size:14px}.panel-head span{font-size:10px;color:var(--subtle);font-weight:700}
    .panel-body{padding:21px}
    .continue-card{background:linear-gradient(105deg,var(--panel),var(--panel-soft));border:1px solid var(--line);border-radius:16px;padding:23px;display:flex;justify-content:space-between;align-items:center;gap:22px}
    .continue-card .continue-kicker{color:var(--mint);font-weight:850;letter-spacing:1.3px;font-size:10px;margin-bottom:6px}.continue-card h3{font-size:17px;margin-bottom:4px}.continue-card p{font-size:12px;max-width:730px}.continue-card .btn{flex-shrink:0}
    .week-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
    .week-card{display:flex;flex-direction:column;padding:22px;text-align:left;color:var(--text);width:100%;min-width:0;gap:9px;transition:border-color .15s,transform .15s}
    .week-card:hover{border-color:var(--mint);transform:translateY(-2px)}
    .week-card .week-head{display:flex;gap:10px;align-items:center;justify-content:space-between}
    .week-number{font-weight:850;color:var(--mint);font-size:10px;letter-spacing:1.1px}.week-card h3{font-size:18px;letter-spacing:-.3px}.week-card p{font-size:12px;line-height:1.6;flex:1}
    .week-card .progress-track{margin-top:6px}.week-card .week-footer{display:flex;justify-content:space-between;gap:10px;color:var(--subtle);font-size:11px}
    .learn-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.learn-card{background:var(--panel);border:1px solid var(--line);padding:17px;border-radius:13px}.learn-card .learn-duration{font-size:15px;font-weight:850;margin-bottom:5px}.learn-card p{font-size:11px;line-height:1.6}
    .learn-card:nth-child(1) .learn-duration{color:var(--blue)}.learn-card:nth-child(2) .learn-duration{color:var(--mint)}.learn-card:nth-child(3) .learn-duration{color:var(--amber)}.learn-card:nth-child(4) .learn-duration{color:var(--purple)}
    .lesson-head{display:flex;gap:20px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.lesson-head .lesson-overline{color:var(--mint);font-weight:800;letter-spacing:1.65px;font-size:10px;text-transform:uppercase;margin-bottom:8px}.lesson-head h1{font-size:clamp(26px,3vw,37px)}.lesson-head p{margin-top:10px;font-size:13px;max-width:760px}
    .lesson-head .back-link{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;padding:2px 0;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:13px}.lesson-head .back-link:hover{color:var(--mint)}
    .lesson-top-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}
    .lesson-meta{display:flex;gap:7px;flex-wrap:wrap;margin:17px 0 20px}.lesson-meta .chip{background:var(--panel)}
    .lesson-grid{display:grid;grid-template-columns:minmax(0,1.68fr) minmax(280px,.86fr);align-items:start;gap:16px}
    .stack{display:grid;gap:16px;min-width:0}
    .step{padding:19px 21px;border-bottom:1px solid var(--line);transition:background .2s}.step:last-child{border-bottom:0}.step.complete{background:color-mix(in srgb,var(--mint) 6%,var(--panel))}
    .step-top{display:flex;align-items:flex-start;gap:13px}.step-check{accent-color:var(--mint);width:20px;height:20px;flex-shrink:0;margin:3px 0 0;cursor:pointer}.step-content{flex:1;min-width:0}
    .step-topline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.step-topline h3{font-size:14px}.time-pill{background:var(--panel-raised);padding:3px 7px;border-radius:6px;font-size:10px;color:var(--amber);font-weight:800}
    .step-list{padding-left:19px;margin:11px 0 0;color:var(--muted);font-size:12px;line-height:1.74}.step-list li{margin-bottom:8px}.step-list li:last-child{margin-bottom:0}
    details.activity-notes{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px}.activity-notes summary{color:var(--blue);font-size:11px;font-weight:700;cursor:pointer;user-select:none}.activity-notes textarea{margin-top:10px;min-height:75px}
    .field-label{display:block;font-weight:750;font-size:12px;margin-bottom:8px}.field{margin-top:17px}.field:first-child{margin-top:0}
    textarea,input[type="search"]{color:var(--text);background:var(--bg);border:1px solid var(--line-bright);border-radius:10px;outline:0;width:100%;padding:12px 13px;font-size:12px;line-height:1.7}
    textarea{display:block;min-height:125px;resize:vertical}textarea.large{min-height:194px}
    textarea:focus,input[type="search"]:focus{border-color:var(--mint);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 13%,transparent)}
    textarea::placeholder,input::placeholder{color:var(--subtle)}.field-help{font-size:10px;margin-top:7px;color:var(--subtle)}
    .notice{padding:14px 15px;border-radius:11px;border:1px solid color-mix(in srgb,var(--mint) 35%,var(--line));background:var(--mint-dark)}.notice .notice-label{font-size:10px;font-weight:850;color:var(--mint);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}.notice p{font-size:12px;line-height:1.7;color:var(--text)}
    .notice.amber{background:color-mix(in srgb,var(--amber) 10%,var(--panel));border-color:color-mix(in srgb,var(--amber) 38%,var(--line))}.notice.amber .notice-label{color:var(--amber)}
    .concepts{display:flex;gap:7px;flex-wrap:wrap}.concept{font-size:11px;border:1px solid var(--line-bright);background:var(--panel-soft);padding:6px 9px;border-radius:7px;color:var(--text)}
    .resource-link{display:flex;gap:8px;align-items:center;text-decoration:none;border-radius:9px;background:var(--panel-soft);border:1px solid var(--line);padding:10px 12px;font-weight:650;font-size:12px;margin-top:8px}.resource-link:hover{border-color:var(--mint)}
    .right-stack{position:sticky;top:95px}.right-stack .panel-body{padding:17px 19px}
    .lesson-footer{display:flex;justify-content:space-between;gap:10px;margin-top:17px}.lesson-footer .footer-actions{display:flex;gap:8px}
    .library-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:23px 0 14px}.library-tools input{max-width:390px}
    .library-heading{margin:25px 0 11px;font-weight:800;font-size:15px}.library-heading span{color:var(--subtle);font-size:11px;font-weight:600;margin-left:8px}
    .library-row{display:flex;gap:15px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}.library-row:last-child{border-bottom:0}.library-row h3{font-size:13px}.library-row p{font-size:11px;margin-top:4px}.library-row .status{font-size:10px;font-weight:800;color:var(--subtle);white-space:nowrap}.library-row .status.done{color:var(--mint)}
    .library-row .row-end{display:flex;gap:12px;align-items:center;flex-shrink:0}
    .library-empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}
    .page-footer{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;margin-top:42px;color:var(--subtle);font-size:10px}

    @media(max-width:1190px){.app{grid-template-columns:238px minmax(0,1fr)}.main{padding-left:22px;padding-right:22px}.lesson-grid{grid-template-columns:minmax(0,1.5fr) minmax(260px,.87fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

    @media(max-width:700px){.main{padding:0 16px 34px}.topbar{min-height:68px;flex-wrap:nowrap;gap:9px}.top-left{flex:1;min-width:0}.crumb{max-width:115px;overflow:hidden;text-overflow:ellipsis}.top-actions{flex-wrap:nowrap;gap:6px;flex-shrink:0}.top-actions .btn.primary{padding:8px 10px}.top-actions .hide-mobile{display:none}.hero{grid-template-columns:1fr;padding:25px 23px}.ring{display:none}.week-grid{grid-template-columns:1fr}.learn-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.continue-card{align-items:stretch;flex-direction:column}.continue-card .btn{align-self:flex-start}.lesson-head{flex-wrap:wrap}.lesson-top-actions{margin-left:auto}.panel-body{padding:17px}.step{padding:18px 16px}.library-row{align-items:flex-start}.library-row .row-end{flex-direction:column;align-items:flex-end}.crumb{font-size:9px}}
    @media(max-width:440px){.stats{gap:8px}.stat{padding:13px 14px}.stat-value{font-size:23px}.top-actions .btn{font-size:11px;padding:8px}.hero h1{font-size:29px}.section-heading h2{font-size:20px}.learn-grid{grid-template-columns:1fr 1fr}.lesson-footer{flex-wrap:wrap}.lesson-footer .footer-actions{width:100%}.lesson-footer .footer-actions .btn{flex:1}.library-tools{flex-direction:column;align-items:stretch}.library-tools input{max-width:none}}

    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
    @media print{.sidebar,.scrim,.topbar,.btn,.toast{display:none!important}.app{display:block}.main{padding:0}.panel,.step,.hero{break-inside:avoid;box-shadow:none}.view:not([hidden]){display:block}}
  </style>
</head>

<div class="app">

<script>

const WEEKS = [{"title":"Business Fundamentals","summary":"How a business creates value, earns profit and survives.","outcome":"Three business maps, a model comparison, a unit-economics model and a cash-flow forecast.","days":[{"title":"Anatomy of a business","goal":"Trace a business from customer problem to money in the bank.","concepts":["Value creation","Customers","Revenue","Costs","Profit"],"blocks":[["Define business, customer, offer, revenue, profit and cash flow in your own words.","Understand the chain: problem → offer → acquisition → sale → delivery → payment → reinvestment."],["Research a cleaning service, an industrial parts distributor and a software subscription business.","Identify the payer, buyer, offering, delivery steps and public evidence for each."],["20 min: Draw the complete business flow for each example.","20 min: List each company’s revenue sources, main expenses and key dependencies.","20 min: Compare which model is easiest to begin with limited capital; separate facts from assumptions."],["Explain the difference between a business that sells something and one that reliably makes money.","Write three unanswered questions about the examples."]],"output":"Three business-system maps plus a one-page comparison.","mastery":"Can you explain how each business attracts, serves and gets paid by customers?"},{"title":"Business models and revenue engines","goal":"Recognize the ways companies earn money and their tradeoffs.","concepts":["Transaction sales","Retainers","Subscriptions","Licensing","Distribution"],"blocks":[["Study one-time purchases, projects, subscriptions, retainers, licensing, wholesale and marketplaces.","Distinguish recurring revenue from profitable revenue."],["Find five real companies covering at least four revenue models.","Record the intended customer, how they charge, and what their website does not reveal."],["20 min: Build a seven-model comparison sheet.","20 min: Score revenue predictability, delivery complexity, customer concentration and capital requirements.","20 min: Pick three models you would consider as a solo founder and defend the choices."],["Explain when a recurring-revenue model can be worse than a one-time sale.","Identify two models that seem difficult with your present capital."]],"output":"Seven-model matrix and a ranked shortlist of three models.","mastery":"Can you compare business models without assuming subscriptions are always superior?"},{"title":"Profit, margin and break-even","goal":"Calculate whether sales actually contribute toward covering costs.","concepts":["Gross profit","Variable costs","Contribution margin","Fixed costs","Break-even"],"blocks":[["Learn revenue = units × price; contribution per unit = price − variable costs.","Learn break-even units = fixed costs ÷ contribution per unit, rounded up; distinguish gross margin from contribution margin."],["Inspect cost categories for a physical product, a cleaning service and an online service.","Classify shipping, payment fees, labor, rent, returns and inventory as appropriate."],["20 min: Calculate unit economics for a $100 product with $43 variable cost and $1,200 fixed monthly costs.","20 min: Recalculate when price falls 15% and when variable cost rises 20%.","20 min: Create your own scenario with a profit table at 10, 50 and 100 monthly sales."],["Explain why $100,000 revenue does not mean $100,000 earned.","Write the three most uncertain cost assumptions."]],"output":"Working unit-economics and break-even worksheet with three scenarios.","mastery":"Can you calculate contribution, contribution margin and break-even correctly?"},{"title":"Cash flow and financial survival","goal":"Understand how a profitable company can still run out of cash.","concepts":["Cash flow","Receivables","Working capital","Inventory","Cash runway"],"blocks":[["Contrast an income statement, balance sheet and cash-flow statement.","Learn how inventory, supplier terms and delayed customer payments affect cash."],["Compare a business paid immediately with one paid 60 days after delivery.","Identify who pays suppliers first and where a funding gap arises."],["20 min: Make a 12-week cash forecast starting with $2,000 CAD.","20 min: Include purchases, customer payment delays, recurring costs and an unexpected expense.","20 min: Mark the lowest cash balance and suggest two legitimate ways to reduce the cash gap."],["Summarize five financial survival principles from Week 1.","Explain profit versus cash using an original example."]],"output":"A 12-week cash forecast and Week 1 summary.","mastery":"Can you show a profitable sale that creates a temporary cash shortfall?"}]},{"title":"Business Judgment","summary":"How to make better decisions under uncertainty and competition.","outcome":"Risk policy, decision journal, competitive-advantage analysis and a failure postmortem.","days":[{"title":"Probability and decisions","goal":"Learn why a smart decision does not guarantee a good outcome.","concepts":["Probability","Expected value","Base rates","Opportunity cost","Bias"],"blocks":[["Learn expected value = sum of (probability × outcome).","Understand survivorship bias, confirmation bias and uncertain probability estimates."],["Study two documented founder stories; list information unavailable before their decisions.","Compare success claims with risks and the possibility of luck."],["20 min: Create three hypothetical business decisions with best/base/worst outcomes.","20 min: Assign illustrative probabilities and calculate expected values.","20 min: Compare expected value with maximum loss and what you could actually afford."],["Explain why a positive expected value may still be unacceptable.","Write down where your probability assumptions came from."]],"output":"Decision comparison table with expected values and uncertainty notes.","mastery":"Can you distinguish decision quality from the outcome of a single attempt?"},{"title":"Protecting capital","goal":"Define limits that preserve your ability to try again.","concepts":["Risk of ruin","Stage gates","Reversible decisions","Reserves","Downside"],"blocks":[["Learn the difference between reversible experiments and irreversible commitments.","Study staged capital deployment and pre-defined stop rules."],["Compare the upfront commitments of a small service, stocked product and equipment-heavy operation.","Identify cancellation costs, inventory risk and hidden fixed expenses."],["20 min: Design a hypothetical $1,000 validation budget; do not assume it must all be spent.","20 min: Divide spending into three gates, each requiring evidence before the next.","20 min: Write your personal risk policy: maximum exposure, cash reserve and stop conditions."],["State three red flags indicating spending is ahead of evidence.","Explain why keeping capital available has value."]],"output":"A three-gate experiment budget and personal capital-protection policy.","mastery":"Can you say exactly what proof justifies each additional dollar?"},{"title":"Competitive advantage","goal":"Identify what stops competitors from capturing a business’s profits.","concepts":["Five Forces","Switching costs","Distribution","Specialization","Pricing power"],"blocks":[["Study industry rivalry, substitutes, new entrants, buyer power and supplier power.","Compare temporary differentiation with durable advantages."],["Compare three providers in one industry using public evidence.","Look for specialization, trust, service quality, cost advantages and customer switching friction."],["20 min: Complete a Five Forces map for the chosen industry.","20 min: Build a three-company advantage matrix with sources and confidence labels.","20 min: Propose two defensible entry strategies for a small operator."],["Explain why cheapest is not always best.","Identify which supposed advantages competitors could quickly copy."]],"output":"Five Forces map and competitive-advantage matrix.","mastery":"Can you identify a real advantage rather than an advertising slogan?"},{"title":"Business failures and decision journals","goal":"Turn other companies’ mistakes into better processes for your own decisions.","concepts":["Premortem","Root cause","Hindsight bias","Kill criteria","Decision journal"],"blocks":[["Learn to separate poor demand, weak economics, bad execution and poor cash management.","Study premortems and hypothesis-driven decision journals."],["Research one documented business failure and one success in a similar industry.","Record what was known at the time, rather than treating the outcome as inevitable."],["20 min: Write a brief failure analysis separating evidence from inference.","20 min: Compare decisions and external circumstances in the two cases.","20 min: Build a reusable decision journal: thesis, evidence, alternatives, risk, trigger and review date."],["Identify three transferable lessons and two unresolved facts.","Explain how a failure can result from several interacting causes."]],"output":"Two-case comparison and reusable founder decision journal.","mastery":"Can you explain a failure without hindsight or a simplistic single cause?"}]},{"title":"Opportunity Discovery","summary":"Find expensive customer problems in ordinary and technology-changing industries.","outcome":"A 30-problem database, industry map and shortlist with evidence grades.","days":[{"title":"Problems worth solving","goal":"Learn to identify costly, repeated problems before inventing solutions.","concepts":["Customer pain","Frequency","Severity","Workarounds","Willingness to pay"],"blocks":[["Distinguish a customer problem from a proposed product.","Look for urgency, repeated spending, costly delays or expensive mistakes."],["Examine public reviews and industry discussions in maintenance, logistics and cleaning.","Look for recurring complaints without assuming every complaint proves demand."],["20 min: Document at least ten specific problems and affected customers.","20 min: Add frequency, consequences, current workarounds and original source.","20 min: Mark each as direct observation, third-party report or hypothesis."],["Choose five problems worth further investigation.","Describe the cheapest evidence that would strengthen each hypothesis."]],"output":"Ten-entry customer-problem log with links or source notes.","mastery":"Can you describe a business problem without immediately pitching a solution?"},{"title":"Boring industries and value chains","goal":"Find value leaks in established business processes.","concepts":["Value chain","Suppliers","Distributors","Buyer","Bottleneck"],"blocks":[["Study how manufacturing, distribution, service and purchasing connect.","Understand that the end user and person approving payment may be different."],["Choose two industries such as HVAC servicing and building supplies.","Map their typical supplier, operator, purchaser and end-customer roles."],["20 min: Draw the value chain of one industry, including money flow.","20 min: Add twelve specific workflow or purchasing problems to your log.","20 min: Identify five bottlenecks and estimate how you might verify their real cost."],["Explain which point in the chain is easiest to access with limited resources.","Label any unverified bottleneck explicitly."]],"output":"One industry value-chain diagram and twelve added problems.","mastery":"Can you identify who uses, buys, supplies and profits at each stage?"},{"title":"AI and robotics as market forces","goal":"Discover technology opportunities without confusing capability with demand.","concepts":["AI augmentation","Automation","Robotics integration","Reliability","Adoption costs"],"blocks":[["Study where AI reduces information-work costs and where robotics affects physical work.","Consider oversight, safety, integration, maintenance, data availability and the total cost of adoption."],["Research eight workflows in small businesses or industrial services.","For each, note the current process and what technology can plausibly do today."],["20 min: Create an eight-workflow AI/robotics impact matrix.","20 min: Generate six business opportunities supporting adoption, servicing or integration.","20 min: Score customer benefit, implementation difficulty, risks and starting capital."],["Identify one incumbent business AI could weaken and one it could help.","List technology claims that require proof rather than forecasts."]],"output":"AI/robotics market-impact matrix and six candidate opportunities.","mastery":"Can you separate something being automatable from it being worth automating?"},{"title":"Prioritize your problem database","goal":"Choose research priorities without treating subjective scores as facts.","concepts":["Opportunity score","Evidence confidence","Market access","Economic impact","Uncertainty"],"blocks":[["Learn to score severity, frequency, spending, access and capital feasibility.","Keep evidence confidence separate from the attractiveness score."],["Clean and consolidate your collected problems; research enough additional ones to reach 30.","Look for competing solutions and repeated patterns."],["20 min: Build a 30-row problem database with source and confidence fields.","20 min: Score all problems 1–5 on five explicit criteria.","20 min: Choose the ten strongest and define one falsification test per top-five problem."],["Write a Week 3 summary with the five strongest problems.","Identify one ranking that might reverse with better evidence."]],"output":"Thirty-problem database and top-ten opportunity shortlist.","mastery":"Can you distinguish problem attractiveness from how confident you are in the evidence?"}]},{"title":"Business Idea Generation","summary":"Turn problems into concepts, compare business models and select candidates.","outcome":"At least 20 business ideas, a feasibility scorecard and three opportunity memos.","days":[{"title":"Systematic idea generation","goal":"Create multiple solutions to real problems instead of chasing inspiration.","concepts":["Problem–solution fit","Specialization","Unbundling","Workflow redesign","Adjacency"],"blocks":[["Learn five methods: solve complaints, serve a niche, simplify complexity, automate friction, complement existing services.","Separate business concept, target buyer and business model."],["Select five customer problems from Week 3.","Find the current alternative and where it disappoints customers."],["20 min: Produce three different solutions for each of five problems.","20 min: Add five additional variations for a total of at least 20 ideas.","20 min: Give each idea a customer, value proposition, model and key cost driver."],["Remove duplicates and check whether each solves a defined problem.","Group ideas into service, physical product, software, distribution and hybrid."]],"output":"Twenty distinct business concepts recorded in the opportunity vault or spreadsheet.","mastery":"Does every concept describe a buyer, a problem, a solution and a payment mechanism?"},{"title":"Select a business vehicle","goal":"Understand how delivery model changes execution difficulty and economics.","concepts":["Service model","Manufacturing","Distribution","Software","Hybrid"],"blocks":[["Compare capital needs, equipment, time-to-revenue, labor dependence, margins and inventory.","Learn why a low startup cost does not guarantee an easy or profitable business."],["Select five ideas and investigate similar providers or supplier requirements.","List what must be built, purchased, contracted or operated."],["20 min: Create two business-model variations for each of five ideas.","20 min: Compare upfront costs, supplier dependency, sales difficulty and repeatability.","20 min: Select a preferred model per idea and sketch one lower-capital test."],["Explain when a service-first approach could lead to a product company.","Explain one case where service-first would be misleading or unsuitable."]],"output":"Five ideas expanded into ten model variations with a comparison.","mastery":"Can you choose a model based on customer value and execution realities?"},{"title":"Feasibility and scoring","goal":"Rank ideas using evidence, constraints and transparent tradeoffs.","concepts":["Scoring matrix","Capital intensity","Competition","Regulation","Sensitivity"],"blocks":[["Learn weighted rankings, disqualifying constraints and sensitivity analysis.","Distinguish long-term industry potential from what you can reasonably explore now."],["Research startup requirements and competitors for six candidate ideas.","Record uncertain cost estimates as ranges rather than invented precise figures."],["20 min: Score six ideas on demand, capital, competition, capability, access and margins.","20 min: Change the two most influential weights and observe ranking changes.","20 min: Narrow to three ideas and list the major reasons each might fail."],["Explain why your favorite idea might not be your highest-ranked one.","Identify two attractive ideas that belong on a future-opportunity list."]],"output":"Six-idea feasibility matrix and evidence-aware top-three shortlist.","mastery":"Can you justify the shortlist without relying on excitement or a single score?"},{"title":"Write three opportunity memos","goal":"Express each business thesis clearly enough to critique or reject it.","concepts":["Thesis","Buyer","Alternative","Assumption","Go/no-go"],"blocks":[["Learn the structure: problem, buyer, evidence, offer, alternatives, economics, risk, next experiment.","Study the difference between a defensible thesis and a persuasive-sounding guess."],["Review Weeks 1–4 and collect evidence for the top three candidates.","Search specifically for reasons customers may not switch or may not pay."],["20 min: Write a one-page memo for candidate A.","20 min: Write a one-page memo for candidate B.","20 min: Write a one-page memo for candidate C; include five assumptions and disconfirming evidence for each."],["Choose which candidate to research first in Month 2.","State what facts would cause you to reject it."]],"output":"Three opportunity memos and a Month 1 decision.","mastery":"Can you defend the opportunity while naming the evidence that would disprove it?"}]},{"title":"Customer Research","summary":"Find the buyer, interview without leading and distinguish evidence from interest.","outcome":"Buyer maps, a neutral interview guide and a customer-research evidence report.","days":[{"title":"Who is the customer?","goal":"Identify users, decision-makers and people controlling the budget.","concepts":["Segmentation","Economic buyer","End user","Buying trigger","Jobs-to-be-done"],"blocks":[["Distinguish users, influencers, buyers, gatekeepers and decision-makers.","Learn segmentation by industry, size, location, job and problem severity."],["Investigate the buying process for two shortlisted opportunities.","Determine who experiences the problem versus who can authorize spending."],["20 min: Create a customer-role map for opportunity A.","20 min: Create a customer-role map for opportunity B.","20 min: Write a testable buyer hypothesis and a likely buying trigger for each."],["Explain why user enthusiasm does not always lead to a purchase.","List the two hardest-to-access buyer roles."]],"output":"Two buyer maps and two testable customer hypotheses.","mastery":"Can you tell who uses, chooses and pays for the offering?"},{"title":"Design unbiased interviews","goal":"Learn to discover past behavior without selling your preferred answer.","concepts":["Discovery interview","Leading question","Past behavior","Consent","Sampling bias"],"blocks":[["Compare “Would you buy this?” with “Tell me about the last time you had this problem.”","Learn to ask about previous spending, workarounds, frequency and the buying process."],["Read credible customer-discovery guidance and inspect five example interview questions.","Rewrite leading or hypothetical questions into neutral past-behavior questions."],["20 min: Draft ten neutral questions about a specific customer problem.","20 min: Add five follow-up questions and a brief consent introduction.","20 min: Practice the interview against a clearly hypothetical scenario; revise weak questions."],["Identify where your language reveals your preferred solution.","Write how you will record participant consent and minimize personal data."]],"output":"Interview script, consent introduction and structured notes template.","mastery":"Can you gather information without influencing the answer you want to hear?"},{"title":"Collect customer evidence","goal":"Practice primary research while accurately recording what actually happened.","concepts":["Primary research","Secondary research","Evidence log","Consent","Source quality"],"blocks":[["Learn to document statements separately from your interpretation.","Understand why simulated interviews, AI personas and public reviews are not equivalent to real buyer conversations."],["Where permitted and feasible, invite consenting adults with relevant experience to short non-commercial research interviews.","If no one is available, review public customer feedback as secondary research and label it clearly."],["20 min: Identify possible participants or trusted public sources.","20 min: Complete one or more conversations when available, or collect relevant secondary accounts.","20 min: Log source, date, problem, workarounds, costs, direct statements and unanswered questions."],["What surprised you or contradicted your hypothesis?","Specify what evidence is still missing and do not invent interviews."]],"output":"Source-labelled customer evidence log; real interviews only if they genuinely occurred.","mastery":"Can you clearly separate a verified account, your interpretation and an AI example?"},{"title":"Interpret evidence, not compliments","goal":"Decide what your research actually supports.","concepts":["Synthesis","Contradictions","Behavioral signals","Purchase intent","Small samples"],"blocks":[["Distinguish compliments from buying behavior and actual purchases.","Learn to look for recurring themes without generalizing too far from a small sample."],["Review all authentic interview notes and public sources.","Group similar problems and highlight contradictory findings."],["20 min: Build a theme table with frequency and source types.","20 min: Classify assumptions as supported, challenged or unresolved.","20 min: Write a research report covering findings, contradictions, sample limits and five next questions."],["State the strongest and weakest evidence of demand.","Define one finding that would make you abandon or revise the idea."]],"output":"Customer discovery report and updated assumption register.","mastery":"Can you explain what customers did, not just what they said they liked?"}]},{"title":"Market and Competitor Research","summary":"Size an accessible market and understand the customer’s alternatives.","outcome":"Competitor map, bottom-up market model, pricing evidence and market-entry assessment.","days":[{"title":"Competitors and substitutes","goal":"Understand what a customer can do instead of choosing your business.","concepts":["Direct competitor","Indirect competitor","Substitute","Status quo","Switching cost"],"blocks":[["Distinguish same-solution competitors, alternatives and the option to do nothing.","Learn why zero visible competitors is not proof of untapped demand."],["Find six providers or alternative solutions in one chosen market.","Collect public evidence about positioning, pricing approach, delivery and limitations."],["20 min: Build a six-provider competitive table.","20 min: Add the customer’s current workaround as a seventh alternative.","20 min: Propose three possible areas of differentiation and list evidence needed to verify them."],["Explain why customers might remain with an inferior incumbent.","Note where competing claims cannot be verified."]],"output":"Six-provider competitor matrix plus status-quo alternative.","mastery":"Can you explain what the customer would compare before buying?"},{"title":"Bottom-up market sizing","goal":"Estimate realistic accessible spending rather than citing gigantic industry totals.","concepts":["TAM","SAM","SOM","Customer count","Spending frequency"],"blocks":[["Learn total, serviceable and realistically obtainable markets.","Practice annual market spending = eligible customers × purchases per year × average spend."],["Find Canadian data from Statistics Canada, government directories or relevant associations.","Record geography, reporting year, definitions and potential missing customer groups."],["20 min: Work a hypothetical 1,500-buyer × $900/year example.","20 min: Build low, base and high scenarios for your opportunity using sourced values and flagged assumptions.","20 min: Compare accessible market spending with what a small new entrant could plausibly serve."],["Identify the three most sensitive inputs.","Explain why market size is not your sales forecast."]],"output":"Sourced bottom-up market estimate with three scenarios.","mastery":"Can you separate the overall market from customers you can actually reach?"},{"title":"Pricing and willingness to pay","goal":"Understand customer reference prices and their relationship to value.","concepts":["Cost-plus","Value-based pricing","Reference price","Service inclusions","Price sensitivity"],"blocks":[["Contrast cost-plus, competitor-based and value-based price setting.","Distinguish publicly advertised prices from final transaction amounts."],["Review six provider pricing pages, quotes published publicly or package descriptions.","Mark “quote required” where actual prices are unavailable."],["20 min: Record package features, limits, fees, contract terms and source dates.","20 min: Create three buyer scenarios with a plausible value calculation and clear assumptions.","20 min: Identify a preliminary price range and what customer research is still required."],["Explain why the cheapest provider may not win.","Record pricing claims that you cannot substantiate."]],"output":"Pricing intelligence sheet and three buyer-value scenarios.","mastery":"Can you support a pricing hypothesis without inventing competitors’ prices?"},{"title":"Industry attractiveness and entry point","goal":"Decide whether the industry merits the next level of validation.","concepts":["Five Forces","Distribution access","Supplier power","Market access","Entry barrier"],"blocks":[["Review competition, substitution, supplier and buyer concentration.","Study how customer acquisition and distribution access can matter more than product features."],["Compare two shortlisted markets using research from this week.","Look for regulation, supplier restrictions, buying cycles and signs of strong price competition."],["20 min: Score both markets on problem severity, demand evidence, accessibility and economics.","20 min: Write each market’s key constraints, threats and AI exposure.","20 min: Write a go/research-more/reject recommendation, including weaknesses in the evidence."],["State the most realistic entry point and main objection.","Prepare your top five unanswered market questions."]],"output":"Two-market assessment and an evidence-based Week 6 recommendation.","mastery":"Can you distinguish a large industry from an attractive entry opportunity?"}]},{"title":"Positioning, Offers and Pricing","summary":"Translate research into an offer customers can understand and you can deliver.","outcome":"Positioning statement, pricing sheet, offer packages and the Week 8 validation blueprint.","days":[{"title":"Value proposition and positioning","goal":"Express a concrete customer outcome rather than vague superiority claims.","concepts":["Positioning","Differentiation","Customer outcome","Proof","Value proposition"],"blocks":[["Learn to express buyer + problem + outcome + method + credible difference.","Avoid unsupported claims like “best”, “guaranteed” and “revolutionary”."],["Analyze five existing businesses’ homepages or offers.","Record exactly which buyer and outcome each tries to appeal to."],["20 min: Draft three distinct positioning statements for your shortlisted opportunity.","20 min: Write a one-sentence offer, a 30-second explanation and three relevant benefits.","20 min: Define proof needed, five customer objections and realistic responses."],["Choose your clearest statement and read it from the buyer’s viewpoint.","Mark every promise not supported by evidence."]],"output":"Three positioning statements plus selected concise value proposition.","mastery":"Can a potential buyer immediately understand who it helps and what changes?"},{"title":"Pricing architecture and price floor","goal":"Ensure pricing accounts for costs, uncertainty and customer value.","concepts":["Price floor","Contribution margin","Markup vs margin","Sensitivity","Break-even"],"blocks":[["Review pricing models and the formula: minimum price = unit variable cost ÷ (1 − target contribution margin).","Distinguish contribution margin from markup and overall net profit."],["Review the pricing evidence collected in Week 6.","Identify components that could vary by order size or customer needs."],["20 min: Solve a $65 variable-cost / 40% contribution-margin example.","20 min: Model three prices with payment fees, delivery, labor and returns.","20 min: Stress test costs +20%, sales −30%, and different fixed expenses."],["Explain why hitting a contribution margin does not automatically generate net profit.","List the most important real cost quotes still needed."]],"output":"Three-price unit economics model with sensitivity tests.","mastery":"Can you defend the price floor and calculate margins correctly?"},{"title":"Design three offer packages","goal":"Define deliverables, delivery boundaries and basic terms.","concepts":["Offer design","Scope","Packages","Delivery effort","Customer friction"],"blocks":[["Study how a package combines result, inclusions, exclusions, price and delivery timeline.","Understand scope creep, unrealistic support promises and operational dependencies."],["Compare three real providers with tiered or clearly specified offerings.","Record their exclusions, support terms and clarity."],["20 min: Define Essential, Standard and Premium packages with exact deliverables.","20 min: Estimate costs, time burden, contribution and execution risks for each.","20 min: Choose one pilot offer and rewrite it in language customers would understand."],["Evaluate the offer from both buyer and operator perspectives.","Identify any term requiring legal, operational or customer validation."]],"output":"Three-tier offer sheet and a selected pilot version.","mastery":"Can the customer and operator both understand exactly what is included?"},{"title":"Seven-week founder blueprint","goal":"Synthesize your research and decide what to test in Week 8.","concepts":["Business thesis","Validation plan","Capital need","Risks","Go/pivot/stop"],"blocks":[["Connect customer pain, market evidence, differentiation, delivery, unit economics and capital.","Learn why the next step is validation, not a premature full launch."],["Audit your notes, opportunity memos, customer findings, competitor matrix and pricing model.","Identify contradictions, weak evidence and questions that need new sources."],["20 min: Complete a one-page blueprint with buyer, problem, offer, price and delivery approach.","20 min: Add market evidence, competition, projected unit economics, capital needs and AI-related changes.","20 min: Design three low-cost Week 8 validation experiments, each with success and stop conditions."],["Choose proceed-to-validation, revise, research-more or reject and explain why.","Write three subjects to revisit and a 12-month question list for later study."]],"output":"Complete founder blueprint and the first three Week 8 demand tests.","mastery":"Can you defend a clear next step using evidence while identifying what remains unknown?"}]}];

const STORAGE_KEY="founder-os-7week-academy-v2";
const OLD_STORAGE_KEY="founder-os-seven-weeks-v1";
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const pct=(n,denom)=>denom?Math.round(n/denom*100):0;
const plainObject=v=>v!==null&&typeof v==="object"&&!Array.isArray(v);
const safeText=(v,limit=120000)=>typeof v==="string"?v.slice(0,limit):"";
const emptyState=()=>({version:2,done:{},remarks:{},notes:{},weekReviews:{},vault:"",last:0,view:"dashboard",theme:"dark"});
let state=emptyState(),current=0,view="dashboard",storageOK=true,toastTimeout=null;
function normalize(raw){
 const s=emptyState();if(!plainObject(raw))return s;
 for(let i=0;i<28;i++){
  for(let k=0;k<4;k++){
   const id=`${i}-${k}`;
   if(raw.done?.[id]===true)s.done[id]=true;
   if(typeof raw.remarks?.[id]==="string")s.remarks[id]=safeText(raw.remarks[id]);
  }
  if(plainObject(raw.notes?.[i])){
   s.notes[i]={};for(const field of ["deliverable","evidence","reflection"]){s.notes[i][field]=safeText(raw.notes[i][field]);}
  }
 }
 for(let w=0;w<7;w++)s.weekReviews[w]=safeText(raw.weekReviews?.[w]);
 s.vault=safeText(raw.vault);
 if(Number.isInteger(raw.last)&&raw.last>=0&&raw.last<28)s.last=raw.last;
 if(["dashboard","lesson","library"].includes(raw.view))s.view=raw.view;
 // Preserve navigation from the original v1 file.
 if(raw.view==="overview")s.view="dashboard";
 if(raw.view==="workbook")s.view="library";
 if(raw.theme==="light")s.theme="light";
 return s;
}
function readState(){
 try{
  let raw=localStorage.getItem(STORAGE_KEY);
  if(!raw)raw=localStorage.getItem(OLD_STORAGE_KEY);
  if(raw)state=normalize(JSON.parse(raw));
  localStorage.setItem("__founder_storage_check","1");localStorage.removeItem("__founder_storage_check");
 }catch(e){storageOK=false;console.warn("Local storage disabled:",e);}
 current=state.last;view=state.view;document.body.dataset.theme=state.theme;
 refreshSaveStatus();
}
function persist(){
 state.last=current;state.view=view;
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;console.warn("Could not save:",e);}
 refreshSaveStatus();
}
function refreshSaveStatus(){
 const el=$("storageStatus");if(el)el.textContent=storageOK?"Auto-saved on this device · export backups":"Saving unavailable · export a backup";
}
function notify(message,error=false){
 const el=$("toast");el.textContent=message;el.classList.toggle("error",error);el.classList.add("show");
 clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove("show"),3100);
}
function done(i,k){return state.done[`${i}-${k}`]===true;}
function count(i){let n=0;for(let k=0;k<4;k++)if(done(i,k))n++;return n;}
function checked(){let n=0;for(let i=0;i<28;i++)n+=count(i);return n;}
function weekCount(w){let n=0;for(let i=w*4;i<w*4+4;i++)n+=count(i);return n;}
function completedSessions(){return SESSIONS.filter(s=>count(s.index)===4).length;}
function writtenOutputs(){return SESSIONS.filter(s=>note(s.index,"deliverable").trim()).length;}
function plannedMinutesChecked(){let total=0;for(let i=0;i<28;i++)for(let k=0;k<4;k++)if(done(i,k))total+=DURATIONS[k];return total;}
function note(i,key){return state.notes[i]?.[key]??"";}
function firstIncomplete(){return SESSIONS.findIndex(s=>count(s.index)<4)===-1?27:SESSIONS.findIndex(s=>count(s.index)<4);}
function progress(p){return `<div class="progress-track"><span style="width:${p}%"></span></div>`;}
function renderNav(){
 $("nav-dashboard").classList.toggle("active",view==="dashboard");
 $("nav-library").classList.toggle("active",view==="library");
 let out="";
 WEEKS.forEach((week,w)=>{
  out+=`<div class="week-label"><span>WEEK ${String(w+1).padStart(2,"0")}</span><span>${weekCount(w)}/16</span></div>`;
  week.days.forEach((s,d)=>{
   const i=w*4+d,c=count(i);
   out+=`<button type="button" class="side-link ${view==="lesson"&&current===i?"active":""}" data-action="lesson" data-index="${i}" ${view==="lesson"&&current===i?'aria-current="page"':""}><span class="side-num">${String(i+1).padStart(2,"0")}</span><span class="side-name">${escapeHTML(s.title)}</span><span class="small-dot ${c===4?"complete":c?"partial":""}"></span></button>`;
  });
 });
 $("weekNavigation").innerHTML=out;
 $("sideProgressText").textContent=`${pct(checked(),112)}% complete`;
 $("sideProgressBar").style.width=`${pct(checked(),112)}%`;
}
function renderDashboard(){
 const total=checked(),p=pct(total,112),next=firstIncomplete(),s=SESSIONS[next];
 let html=`<div class="hero"><div><div class="eyebrow">Phase 01 · Your 7-week founder journey</div><h1>Build the judgment.<br>Then build the business.</h1><p>A practical business education system for a solo founder starting with limited capital. Study real industries, make financial decisions, test ideas against evidence, and prepare a financially sensible offer.</p><div class="chips"><span class="chip"><b>7</b> weeks</span><span class="chip"><b>28</b> sessions</span><span class="chip"><b>56</b> planned hours</span><span class="chip">4 days a week · 2 hours a day</span></div></div><div class="ring" style="--percent:${p}%" aria-label="${p}% of planned activities checked"><div class="ring-center"><strong>${p}%</strong><span>COMPLETE</span></div></div></div>`;
 html+=`<div class="stats"><div class="stat"><div class="stat-label">Sessions completed</div><div class="stat-value">${completedSessions()} <span style="color:var(--subtle);font-size:15px">/ 28</span></div><div class="stat-note">All four stages checked</div></div><div class="stat"><div class="stat-label">Activities checked</div><div class="stat-value">${total} <span style="color:var(--subtle);font-size:15px">/ 112</span></div><div class="stat-note">Learning, research, practice, review</div></div><div class="stat"><div class="stat-label">Written deliverables</div><div class="stat-value">${writtenOutputs()} <span style="color:var(--subtle);font-size:15px">/ 28</span></div><div class="stat-note">Evidence in your workbook</div></div><div class="stat"><div class="stat-label">Planned study time checked</div><div class="stat-value">${(plannedMinutesChecked()/60).toFixed(1)}h</div><div class="stat-note">Estimated, not time tracked</div></div></div>`;
 html+=`<div class="section-heading"><div><div class="section-overline">Pick up where you left off</div><h2>Next learning session</h2></div></div><div class="continue-card"><div><div class="continue-kicker">WEEK ${s.wi+1} · SESSION ${String(next+1).padStart(2,"0")}</div><h3>${escapeHTML(s.title)}</h3><p>${escapeHTML(s.goal)}</p></div><button type="button" class="btn primary" data-action="lesson" data-index="${next}">Open session →</button></div>`;
 html+=`<div class="section-heading"><div><div class="section-overline">Your training roadmap</div><h2>Seven weeks, one coherent foundation</h2><p>Each week contains four detailed two-hour sessions, exercises and deliverables.</p></div></div><div class="week-grid">`;
 WEEKS.forEach((w,wi)=>{const c=weekCount(wi),wp=pct(c,16);html+=`<button type="button" class="week-card" data-action="lesson" data-index="${wi*4}"><div class="week-head"><span class="week-number">WEEK ${String(wi+1).padStart(2,"0")}</span><span style="color:var(--subtle);font-size:11px">${wp}%</span></div><h3>${escapeHTML(w.title)}</h3><p>${escapeHTML(w.summary)}</p>${progress(wp)}<div class="week-footer"><span>${c} of 16 stages</span><span>8 planned hours ↗</span></div></button>`;});html+="</div>";
 html+=`<div class="section-heading"><div><div class="section-overline">Repeat for every session</div><h2>The two-hour study method</h2></div></div><div class="learn-grid"><div class="learn-card"><div class="learn-duration">20 min · Learn</div><p>Understand terms, frameworks and formulas.</p></div><div class="learn-card"><div class="learn-duration">25 min · Investigate</div><p>Find sources and inspect real businesses.</p></div><div class="learn-card"><div class="learn-duration">60 min · Apply</div><p>Build a calculation, map, memo or analysis.</p></div><div class="learn-card"><div class="learn-duration">15 min · Review</div><p>Test yourself and record uncertainty.</p></div></div>`;
 html+=`<div class="section-heading"><div><div class="section-overline">Your approach</div><h2>Build evidence, not excitement</h2></div></div><div class="panel"><div class="panel-body"><div class="notice"><div class="notice-label">The founder standard</div><p>Research before risking money. Distinguish facts from guesses. A rejected idea can be a good outcome. AI and robotics matter when they change customer value or business economics—not merely because they are popular.</p></div><p style="font-size:11px;margin-top:13px">Canadian context: verify your current immigration and work authorization, age-related requirements, and applicable rules before beginning commercial activity. This course is a learning program, not legal advice.</p></div></div>`;
 $("dashboard").innerHTML=html;
}
function sessionCard(stage,i){
 const id=`${current}-${i}`;
 return `<article class="step ${done(current,i)?"complete":""}" data-step="${i}"><div class="step-top"><input type="checkbox" class="step-check" id="check-${i}" data-check="${id}" ${done(current,i)?"checked":""} aria-label="Mark ${escapeHTML(STAGES[i])} complete"><div class="step-content"><div class="step-topline"><label for="check-${i}" style="cursor:pointer"><h3>${i+1}. ${escapeHTML(STAGES[i])}</h3></label><span class="time-pill">${DURATIONS[i]} MIN</span></div><ul class="step-list">${stage.map(x=>`<li>${escapeHTML(x)}</li>`).join("")}</ul><details class="activity-notes"><summary>Notes for this study block${state.remarks[id]?.trim()?" · saved":""}</summary><textarea data-remark="${id}" placeholder="What I tried, discovered, calculated or struggled with...">${escapeHTML(state.remarks[id]||"")}</textarea></details></div></div></article>`;
}
function renderLesson(){
 const s=SESSIONS[current],c=count(current),p=pct(c,4);
 let html=`<div class="lesson-head"><div><button type="button" class="back-link" data-action="dashboard">← Back to mission control</button><div class="lesson-overline">WEEK ${String(s.wi+1).padStart(2,"0")} / 7 · STUDY DAY ${s.di+1} / 4 · SESSION ${String(current+1).padStart(2,"0")} / 28</div><h1>${escapeHTML(s.title)}</h1><p>${escapeHTML(s.goal)}</p></div><div class="lesson-top-actions"><button class="btn" type="button" data-action="prev" ${current===0?"disabled":""} aria-label="Previous session">←</button><button class="btn primary" type="button" data-action="next" ${current===27?"disabled":""} aria-label="Next session">Next →</button></div></div>`;
 html+=`<div class="lesson-meta"><span class="chip"><b>120 min</b> per session</span><span class="chip"><b id="lessonChecked">${c} / 4</b> blocks checked</span><span class="chip">${escapeHTML(WEEKS[s.wi].title)}</span><span class="chip">Offline, self-paced</span></div>`;
 html+=`<div class="lesson-grid"><div class="stack"><section class="panel"><div class="panel-head"><h3>Today's study plan</h3><span id="progressLabel">${p}% checked</span></div><div style="padding:0 21px 16px">${progress(p).replace('<div class="progress-track">','<div class="progress-track" style="margin-top:15px" id="lessonProgressTrack">')}</div>${s.blocks.map((block,k)=>sessionCard(block,k)).join("")}</section>`;
 html+=`<section class="panel"><div class="panel-head"><h3>Required deliverable</h3><span>YOUR WORK</span></div><div class="panel-body"><div class="notice"><div class="notice-label">Create this</div><p>${escapeHTML(s.output)}</p></div><div class="field"><label class="field-label" for="deliverable">Deliverable / calculations / summary</label><textarea class="large" id="deliverable" data-note="deliverable" placeholder="Record your actual work, calculations, findings, assumptions and conclusions. You can summarize work kept in another spreadsheet or document.">${escapeHTML(note(current,"deliverable"))}</textarea><div class="field-help">Auto-saved locally and included in the JSON export.</div></div></div></section>`;
 if(s.di===3){html+=`<section class="panel"><div class="panel-head"><h3>End-of-week checkpoint</h3><span>WEEK ${s.wi+1} REVIEW</span></div><div class="panel-body"><div class="notice"><div class="notice-label">Expected outcome</div><p>${escapeHTML(WEEKS[s.wi].outcome)}</p></div><div class="field"><label class="field-label" for="weekReview">Week ${s.wi+1} reflection</label><textarea id="weekReview" data-week-review="${s.wi}" placeholder="What did I understand? What evidence changed my thinking? What remains unproven?">${escapeHTML(state.weekReviews[s.wi]||"")}</textarea></div></div></section>`;}
 html+=`<div class="lesson-footer"><button class="btn" type="button" data-action="prev" ${current===0?"disabled":""}>← Previous</button><div class="footer-actions"><button class="btn" type="button" data-action="library">Workbook</button><button class="btn primary" type="button" data-action="next" ${current===27?"disabled":""}>Next session →</button></div></div></div>`;
 const links=RESOURCE_LINKS[s.wi].map(([title,url])=>`<a class="resource-link" href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">↗ ${escapeHTML(title)}</a>`).join("");
 html+=`<div class="stack right-stack"><section class="panel"><div class="panel-head"><h3>Concepts to master</h3><span>${s.concepts.length} TERMS</span></div><div class="panel-body"><div class="concepts">${s.concepts.map(x=>`<span class="concept">${escapeHTML(x)}</span>`).join("")}</div></div></section>`;
 html+=`<section class="panel"><div class="panel-head"><h3>Evidence and sources</h3><span>AUTO-SAVED</span></div><div class="panel-body"><label class="field-label" for="evidence">Sources, dates and observations</label><textarea id="evidence" data-note="evidence" placeholder="Source / date / observed fact / remaining assumptions...">${escapeHTML(note(current,"evidence"))}</textarea><div class="field-help">Keep actual observations separate from hypotheses and AI-generated examples.</div></div></section>`;
 html+=`<section class="panel"><div class="panel-head"><h3>Reflection</h3><span>AUTO-SAVED</span></div><div class="panel-body"><label class="field-label" for="reflection">What did you learn?</label><textarea id="reflection" data-note="reflection" placeholder="What was difficult? What was surprising? What would you do next?">${escapeHTML(note(current,"reflection"))}</textarea></div></section>`;
 html+=`<section class="panel"><div class="panel-head"><h3>Mastery test</h3><span>WITHOUT NOTES</span></div><div class="panel-body"><div class="notice amber"><div class="notice-label">Explain your reasoning</div><p>${escapeHTML(s.mastery)}</p></div><p style="font-size:11px;margin-top:11px">Check your own reasoning before consulting an AI tutor.</p></div></section>`;
 html+=`<section class="panel"><div class="panel-head"><h3>Study with an AI tutor</h3></div><div class="panel-body"><p style="font-size:12px;margin-bottom:12px">Copy this exact session as a structured prompt. Your tutor will teach, ask questions and critique your work instead of completing everything for you.</p><button class="btn primary" type="button" data-action="copy" style="width:100%">Copy tutor prompt</button></div></section>`;
 html+=`<section class="panel"><div class="panel-head"><h3>Research starting points</h3></div><div class="panel-body">${links}<div class="field-help">Online links require internet. Verify source dates, applicability and changing rules.</div></div></section></div></div>`;
 $("lesson").innerHTML=html;
}
function renderLibrary(){
 const doneCount=completedSessions(),outputCount=writtenOutputs();
 $("library").innerHTML=`<div class="hero" style="grid-template-columns:minmax(0,1fr)"><div><div class="eyebrow">Your evidence portfolio</div><h1>Founder workbook.</h1><p>Keep the outputs that matter: calculations, decisions, market research, competitor findings and explanations. Checkboxes reflect activity completion; written work captures what you actually learned.</p><div class="chips"><span class="chip"><b>${outputCount}</b> written outputs</span><span class="chip"><b>${doneCount}</b> completed sessions</span><span class="chip"><b>28</b> expected artifacts</span></div></div></div><div class="section-heading"><div><div class="section-overline">Working notebook</div><h2>Opportunity vault</h2><p>Questions, promising problems, businesses to investigate and observations across the course.</p></div></div><section class="panel"><div class="panel-body"><label class="field-label" for="vault">Your ideas and research notes</label><textarea class="large" id="vault" data-vault placeholder="Problem observed / who experiences it / potential economic consequence / evidence / next research step...">${escapeHTML(state.vault)}</textarea><div class="field-help">Saved locally. Included in JSON exports.</div></div></section><div class="section-heading"><div><div class="section-overline">Course outputs</div><h2>All 28 deliverables</h2><p>Search by business topic, week, or lesson title.</p></div></div><div class="library-tools"><input id="librarySearch" type="search" aria-label="Search study sessions" placeholder="Search sessions and deliverables..."><button type="button" class="btn primary" data-action="export">Export full workbook ↓</button></div><div id="libraryResults"></div><div class="section-heading"><div><div class="section-overline">Your data</div><h2>Backups and privacy</h2></div></div><section class="panel"><div class="panel-body"><div class="notice"><div class="notice-label">Local-first</div><p>Your notes and checkmarks stay in this browser unless you export and share them. Clearing site data, changing browsers or using private browsing can erase local progress. Download backups regularly.</p></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:15px"><button class="btn primary" type="button" data-action="export">Export JSON</button><button class="btn" type="button" data-action="import">Restore JSON</button><button class="btn danger" type="button" data-action="reset">Reset progress</button></div></div></section>`;
 renderLibraryRows("");
}
function renderLibraryRows(search){
 const q=search.trim().toLowerCase();let output="",found=0;
 WEEKS.forEach((week,wi)=>{
  let rows="";
  week.days.forEach((s,di)=>{
   const i=wi*4+di;
   if(q&&!(`${week.title} ${s.title} ${s.output} ${s.goal} ${s.concepts.join(" ")}`).toLowerCase().includes(q))return;
   found++;
   const hasOutput=!!note(i,"deliverable").trim();
   rows+=`<div class="library-row"><div style="min-width:0"><h3>${String(i+1).padStart(2,"0")} · ${escapeHTML(s.title)}</h3><p>${escapeHTML(s.output)}</p><p>${count(i)}/4 learning blocks checked</p></div><div class="row-end"><span class="status ${hasOutput?"done":""}">${hasOutput?"WORK RECORDED":"OUTPUT PENDING"}</span><button class="btn" type="button" data-action="lesson" data-index="${i}">Open →</button></div></div>`;
  });
  if(rows)output+=`<div class="library-heading">Week ${wi+1} · ${escapeHTML(week.title)} <span>${weekCount(wi)}/16 checked</span></div><div class="panel">${rows}</div>`;
 });
 $("libraryResults").innerHTML=found?output:'<div class="panel library-empty">No matching sessions. Try a different keyword.</div>';
}
function updateLessonProgress(){
 if(view!=="lesson")return;
 const c=count(current),percent=pct(c,4);
 const label=$("progressLabel"),checkedLabel=$("lessonChecked"),track=$("lessonProgressTrack");
 if(label)label.textContent=`${percent}% checked`;
 if(checkedLabel)checkedLabel.textContent=`${c} / 4`;
 if(track){const bar=track.querySelector("span");if(bar)bar.style.width=`${percent}%`;}
}
function closeMenu(){const sidebar=$("sidebar"),scrim=$("scrim"),toggle=$("menuButton");sidebar.classList.remove("open");scrim.classList.remove("show");toggle.setAttribute("aria-expanded","false");}
function openMenu(){const sidebar=$("sidebar"),scrim=$("scrim"),toggle=$("menuButton");sidebar.classList.add("open");scrim.classList.add("show");toggle.setAttribute("aria-expanded","true");}
function render(){
 for(const id of ["dashboard","lesson","library"])$(id).hidden=id!==view;
 if(view==="dashboard")renderDashboard();else if(view==="lesson")renderLesson();else renderLibrary();
 $("breadcrumb").innerHTML=view==="lesson"?`FOUNDER OS <span>/</span> WEEK ${SESSIONS[current].wi+1} <span>/</span> <strong>DAY ${current+1}</strong>`:`FOUNDER OS <span>/</span> <strong>${view==="dashboard"?"MISSION CONTROL":"WORKBOOK"}</strong>`;
 $("themeButton").textContent=state.theme==="dark"?"☼":"☾";
 renderNav();
}
function navigate(next,index){
 if(Number.isInteger(index))current=Math.min(27,Math.max(0,index));
 view=next;persist();render();closeMenu();window.scrollTo({top:0,behavior:"instant"});
}
function tutorPrompt(){
 const s=SESSIONS[current];
 return `You are my rigorous business education tutor. I am studying entrepreneurship as a solo beginner in Canada, transitioning to PR, with limited starting capital. I have four days per week and two hours each day. My interests include traditional businesses, physical products, B2B, AI and robotics. Focus on durable business judgment, not trading or overnight riches.\n\nWEEK ${s.wi+1}, SESSION ${current+1}: ${s.title}\nGOAL: ${s.goal}\nCONCEPTS: ${s.concepts.join(", ")}\n\n20 MIN LEARN:\n${s.blocks[0].map((x,i)=>`${i+1}. ${x}`).join("\n")}\n\n25 MIN INVESTIGATE:\n${s.blocks[1].map((x,i)=>`${i+1}. ${x}`).join("\n")}\n\n60 MIN APPLY:\n${s.blocks[2].map((x,i)=>`${i+1}. ${x}`).join("\n")}\n\n15 MIN REVIEW:\n${s.blocks[3].map((x,i)=>`${i+1}. ${x}`).join("\n")}\n\nDELIVERABLE: ${s.output}\nMASTERY CHECK: ${s.mastery}\n\nCURRENT EVIDENCE NOTES:\n${note(current,"evidence")||"(none yet)"}\n\nCURRENT REFLECTIONS:\n${note(current,"reflection")||"(none yet)"}\n\nINSTRUCTIONS: Start with two short diagnostic questions. Teach the principles with realistic examples, label hypothetical information, and ask me to attempt exercises before showing solutions. Challenge weak evidence, incorrect calculations and optimistic assumptions. Never fabricate customer research or claim to verify facts without a source. Use Canadian context where useful; advise verifying legal, immigration, tax or regulatory requirements with official sources. At the end, assess my understanding on a 0–5 scale and identify one revision exercise. Do not advance to the next session unless I ask. Begin with the diagnostic questions.`;
}
async function copyTutor(){
 const prompt=tutorPrompt();
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(prompt);notify("Tutor prompt copied.");return;}}catch(e){console.warn("Clipboard API failed",e);}
 const el=document.createElement("textarea");el.value=prompt;el.style.position="fixed";el.style.opacity="0";document.body.appendChild(el);el.select();
 let ok=false;try{ok=document.execCommand("copy");}catch(e){}
 el.remove();notify(ok?"Tutor prompt copied.":"Clipboard access unavailable in this browser.",!ok);
}
function makeExport(){
 const weeks=WEEKS.map((w,wi)=>({
   week:wi+1,
   title:w.title,
   summary:w.summary,
   expected_output:w.outcome,
   week_review:state.weekReviews[wi]||"",
   sessions:w.days.map((s,di)=>{
     const i=wi*4+di;
     return {
       session:i+1,title:s.title,goal:s.goal,concepts:s.concepts,
       blocks:s.blocks.map((instructions,k)=>({
         type:STAGES[k],minutes:DURATIONS[k],instructions,
         complete:done(i,k),remarks:state.remarks[`${i}-${k}`]||""
       })),
       expected_deliverable:s.output,mastery_question:s.mastery,
       actual_work:state.notes[i]||{}
     };
   })
 }));
 return {
   format:"founder-os-7week-v2",version:2,exported_at:new Date().toISOString(),
   course:{title:"Founder OS — Seven-Week Business Academy",weeks:7,sessions:28,sessions_per_week:4,minutes_per_session:120,total_planned_hours:56},
   summary:{activity_blocks_checked:checked(),total_blocks:112,sessions_completed:completedSessions(),deliverables_recorded:writtenOutputs(),planned_minutes_checked:plannedMinutesChecked()},
   weeks,opportunity_vault:state.vault,saved_state:state
 };
}
function exportBackup(){
 const blob=new Blob([JSON.stringify(makeExport(),null,2)],{type:"application/json;charset=utf-8"});
 const url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=`founder-os-7-weeks-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notify("Complete workbook exported as JSON.");
}
async function importBackup(file){
 if(!file)return;
 try{
  const data=JSON.parse(await file.text());
  if(!plainObject(data)||!plainObject(data.saved_state)||!(["founder-os-7week-v2","founder-os-seven-weeks"].includes(data.format)))throw Error("Unrecognized Founder OS backup.");
  if(!confirm("Restore this backup? Current locally saved progress and notes will be replaced."))return;
  state=normalize(data.saved_state);current=state.last;view=state.view;document.body.dataset.theme=state.theme;persist();render();notify("Backup restored successfully.");
 }catch(e){notify(`Import failed: ${e.message}`,true);}finally{$("fileInput").value="";}
}
function resetAll(){
 if(!confirm("Delete your locally saved progress, notes and workbook? Export a backup first if you may need them."))return;
 if(!confirm("Confirm reset? This cannot be undone without a backup."))return;
 state=emptyState();current=0;view="dashboard";document.body.dataset.theme="dark";persist();render();notify("Local progress reset.");
}
document.addEventListener("click",e=>{
 const control=e.target.closest("[data-action]");if(!control)return;
 const action=control.dataset.action,index=Number(control.dataset.index);
 switch(action){
 case "menu":openMenu();break;
 case "close-menu":closeMenu();break;
 case "dashboard":navigate("dashboard");break;
 case "library":navigate("library");break;
 case "lesson":navigate("lesson",index);break;
 case "next":if(current<27)navigate("lesson",current+1);break;
 case "prev":if(current>0)navigate("lesson",current-1);break;
 case "copy":copyTutor();break;
 case "export":exportBackup();break;
 case "import":$("fileInput").click();break;
 case "reset":resetAll();break;
 case "theme":state.theme=state.theme==="dark"?"light":"dark";document.body.dataset.theme=state.theme;persist();render();break;
 }
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.matches("[data-check]")){
  state.done[t.dataset.check]=t.checked;persist();t.closest(".step")?.classList.toggle("complete",t.checked);renderNav();updateLessonProgress();
 }else if(t.id==="fileInput")importBackup(t.files?.[0]);
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.matches("[data-note]")){
  state.notes[current]??={};state.notes[current][t.dataset.note]=t.value;persist();
 }else if(t.matches("[data-remark]")){
  state.remarks[t.dataset.remark]=t.value;persist();
 }else if(t.matches("[data-week-review]")){
  state.weekReviews[t.dataset.weekReview]=t.value;persist();
 }else if(t.matches("[data-vault]")){
  state.vault=t.value;persist();
 }else if(t.id==="librarySearch")renderLibraryRows(t.value);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu();});
readState();render();
</script>
</body>
</html>
